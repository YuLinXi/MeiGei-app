    :root {
      --sans: "Manrope", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --narrow: "Barlow Condensed", "Arial Narrow", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
      --serif: "Songti SC", "Noto Serif CJK SC", "SimSun", "PingFang SC", serif;
      font: 15px/1.5 var(--sans);
      font-synthesis: none;
      -webkit-text-size-adjust: 100%;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body, h1, h2, h3, p, figure { margin: 0; }
    button, input { font: inherit; }
    button, a, input { -webkit-tap-highlight-color: transparent; }
    button {
      border: 0;
      color: inherit;
      background: none;
      cursor: pointer;
      padding: 0;
      touch-action: manipulation;
    }
    button:disabled { cursor: default; opacity: .4; }
    button:focus-visible, a:focus-visible, input:focus-visible {
      outline: 2px solid var(--focus-ring, #4236bd);
      outline-offset: 3px;
    }
    button, a { -webkit-user-select: none; user-select: none; }
    a { color: inherit; }
    img { display: block; max-width: 100%; object-fit: contain; }
    [hidden] { display: none !important; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    body {
      --paper: #22282d;
      --ink: #f4eee6;
      --muted: #acb9be;
      --line: #404c53;
      --surface: #2e373e;
      --action: #ffab76;
      --action-ink: #261b16;
      --subtle: #3b3130;
      --focus-ring: #ffbf93;
      --stage: #353d41;
      --rail: #faf9f5;
      --frame: #65727a;
      --shadow: #0d131668;
      display: grid;
      grid-template-columns: clamp(300px, 27vw, 400px) minmax(0, 1fr);
      min-height: 100vh;
      min-height: 100svh;
      background: var(--rail);
    }

    body[data-variant="ledger"] {
      --paper: #f7f9f4;
      --ink: #182b50;
      --muted: #53627a;
      --line: #d5dcec;
      --surface: #eaf0f9;
      --action: #283da1;
      --action-ink: #fff;
      --subtle: #e8edcc;
      --focus-ring: #324ab8;
      --stage: #cdd9ee;
      --frame: #eaf0f9;
      --shadow: #223d7e32;
    }

    body[data-variant="focus"] {
      --paper: #f7f3ff;
      --ink: #282043;
      --muted: #625879;
      --line: #e1d8f5;
      --surface: #ede5fe;
      --action: #5537ad;
      --action-ink: #fff;
      --subtle: #e7dcff;
      --focus-ring: #5537ad;
      --stage: #ccbcf1;
      --frame: #eee5ff;
      --shadow: #40307144;
    }

    .gallery {
      --focus-ring: #4236bd;
      display: flex;
      flex-direction: column;
      gap: 33px;
      padding: clamp(24px, 4vw, 60px) clamp(25px, 3.45vw, 50px) 30px;
      color: #242526;
      background: var(--rail);
    }

    .gallery-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 34px;
      white-space: nowrap;
    }
    .gallery-brand strong { font-size: 18px; font-weight: 800; letter-spacing: -.05em; }
    .gallery-tag { margin-left: auto; color: #666860; font-size: 12px; }
    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      background: #22282a;
      color: #f5f2e9;
      border-radius: 9px;
    }
    .brand-mark i {
      width: 22px;
      height: 2px;
      background: currentColor;
      position: relative;
      border-radius: 1px;
      transform: rotate(-18deg);
    }
    .brand-mark i::before, .brand-mark i::after {
      content: "";
      width: 4px;
      height: 12px;
      border-radius: 2px;
      position: absolute;
      top: -5px;
      background: currentColor;
    }
    .brand-mark i::before { left: 3px; }
    .brand-mark i::after { right: 3px; }
    .gallery-intro { margin-top: clamp(12px, 7vh, 75px); }
    .gallery-intro h1 {
      font-size: clamp(32px, 3.4vw, 50px);
      letter-spacing: -.075em;
      font-weight: 800;
      line-height: 1.12;
      white-space: nowrap;
    }
    .gallery-intro p { color: #61635d; margin-top: 15px; font-size: 14px; }
    .variant-list { display: grid; gap: 4px; }
    .variant-list button {
      display: flex;
      align-items: center;
      text-align: left;
      width: 100%;
      min-height: 65px;
      border-radius: 12px;
      gap: 13px;
      padding: 9px 11px;
      border: 1px solid transparent;
      transition: background .18s, border-color .18s;
    }
    .variant-list button:hover { background: #eeede8; }
    .variant-list button[aria-pressed="true"] {
      background: #fff;
      border-color: #e5e3db;
      box-shadow: 0 2px 3px #3d392508;
    }
    .variant-list strong { font-weight: 800; }
    .variant-list small { display: block; color: #606460; margin-top: 3px; font-size: 12px; }
    .choice-arrow { margin-left: auto; color: #6d706a; font-size: 17px; }
    .variant-list button[aria-pressed="true"] .choice-arrow { color: #202523; }
    .swatch {
      position: relative;
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      border-radius: 8px;
      overflow: hidden;
    }
    .swatch-console {
      background: repeating-linear-gradient(90deg, #fff2 0 1px, transparent 1px 5px) center 27px / 22px 4px no-repeat, #303b41;
    }
    .swatch-console::before {
      content: "";
      position: absolute;
      inset: 9px 7px 15px;
      border: 1px solid #ffbe8a;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent 47%, #ffbe8a 47% 53%, transparent 53%);
    }
    .swatch-ledger {
      background: repeating-linear-gradient(0deg, #596fb684 0 1px, transparent 1px 6px) center / 22px 17px no-repeat, #dce5f8;
    }
    .swatch-ledger::before {
      content: "";
      position: absolute;
      left: 13px;
      top: 7px;
      bottom: 7px;
      border-left: 1px solid #596fb6a6;
    }
    .swatch-focus { background: #ddceff; }
    .swatch-focus::before {
      content: "";
      position: absolute;
      width: 24px;
      height: 24px;
      left: 6px;
      top: 6px;
      border-radius: 50%;
      border: 1px solid #7a63ba;
      box-shadow: inset 0 0 0 5px #f1eaff, inset 0 0 0 6px #8d72d4;
    }
    .design-note { border-top: 1px solid #ddded7; padding-top: 17px; }
    .design-note p { font-size: 13px; line-height: 1.8; }
    .design-note a {
      text-decoration-color: #a0a098;
      text-underline-offset: .26em;
      display: inline-block;
      padding-block: 8px;
      font-size: 12px;
      color: #565953;
    }
    .reset-link {
      align-self: flex-start;
      color: #535750;
      min-height: 44px;
      font-size: 12px;
      margin-top: auto;
      white-space: nowrap;
    }
    .reset-link span { font-size: 16px; vertical-align: -1px; }

    .stage {
      min-width: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 23px;
      color: var(--ink);
      background-color: var(--stage);
      transition: background-color .22s ease;
    }
    body[data-variant="console"] .stage {
      background-image:
        repeating-radial-gradient(circle at 77% 65%, transparent 0 35px, #e8eee709 36px 37px, transparent 38px 74px),
        radial-gradient(ellipse at 12% 0%, #727873 0, #484f4f 38%, transparent 73%);
    }
    body[data-variant="ledger"] .stage {
      background-image:
        linear-gradient(90deg, #596fb622 1px, transparent 1px),
        linear-gradient(0deg, #596fb622 1px, transparent 1px),
        radial-gradient(ellipse at 42% 10%, #e8ecf8 8%, transparent 75%);
      background-size: 36px 36px, 36px 36px, auto;
    }
    body[data-variant="focus"] .stage {
      background-image:
        radial-gradient(ellipse at 32% 3%, #f5deed 2%, transparent 58%),
        radial-gradient(ellipse at 100% 100%, #aea2e2 7%, transparent 51%);
    }
    .device {
      width: min(100%, 432px);
      height: min(828px, calc(100svh - 46px));
      min-height: 535px;
      position: relative;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid var(--frame);
      border-radius: 29px;
      box-shadow: 0 30px 75px var(--shadow);
      isolation: isolate;
      overflow: hidden;
    }
    .app-header {
      height: 57px;
      padding: 0 19px 0 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--line);
    }
    .header-main, .clock-pill, .finish-link { display: inline-flex; align-items: center; }
    .header-main { gap: 9px; min-width: 0; }
    .header-main strong { font-size: 13px; font-weight: 800; white-space: nowrap; }
    .clock-pill {
      gap: 6px;
      padding: 5px 8px;
      border-radius: 7px;
      color: var(--ink);
      background: var(--surface);
      font: 500 12px/1 var(--mono);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .live-dot {
      height: 6px;
      width: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: var(--action);
    }
    .finish-link {
      padding: 0 4px 0 8px;
      min-height: 44px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }
    .finish-link:hover { color: var(--ink); }
    .workout-body {
      min-height: 0;
      min-width: 0;
      overflow: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
      scrollbar-gutter: stable;
    }
    .app-dock {
      padding: 11px 18px 14px;
      border-top: 1px solid var(--line);
      background: var(--paper);
      display: flex;
      align-items: stretch;
      gap: 9px;
      z-index: 1;
    }
    .primary, .secondary, .sub-button {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 10px;
      font-weight: 800;
      padding: 0 13px;
      text-align: center;
      transition: background .16s, transform .16s;
    }
    .primary { background: var(--action); color: var(--action-ink); min-height: 52px; }
    .primary:active, .secondary:active, .sub-button:active { transform: scale(.98); }
    .primary:hover { filter: brightness(1.05); }
    .secondary { color: var(--ink); background: var(--surface); }
    .sub-button { color: var(--ink); min-height: 44px; border: 1px solid var(--line); }
    .stretch { flex: 1; min-width: 0; }
    .check-sigil { font-size: 18px; line-height: 1; font-family: system-ui, sans-serif; }
    .list-sigil, .list-sigil::before, .list-sigil::after {
      width: 13px;
      height: 1.5px;
      background: currentColor;
      border-radius: 1px;
    }
    .list-sigil { position: relative; }
    .list-sigil::before, .list-sigil::after { content: ""; position: absolute; left: 0; }
    .list-sigil::before { top: -4px; }
    .list-sigil::after { top: 4px; }
    .chevron {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-bottom: 1.65px solid currentColor;
      border-right: 1.65px solid currentColor;
      transform: rotate(-45deg);
      flex: 0 0 8px;
    }
    .chevron.down { transform: rotate(45deg) translate(-1px, -1px); }
    .chevron.up { transform: rotate(225deg) translate(-1px, -1px); }
    .minor { font-size: 12px; color: var(--muted); }
    .count { font: 500 13px/1.15 var(--mono); font-variant-numeric: tabular-nums; }
    .meter-line { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
    .meter-line > i {
      background: var(--action);
      display: block;
      height: 100%;
      width: var(--progress);
      border-radius: inherit;
      transition: width .26s linear;
    }
    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 9px;
      min-height: 44px;
    }
    .section-title h3 { font-size: 14px; font-weight: 800; }
    .inline-link {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
    }
    .inline-link:hover { color: var(--ink); }
    .inline-link b { font-size: 17px; }
    .toast {
      color: var(--paper);
      background: var(--ink);
      box-shadow: 0 4px 20px #0003;
      position: absolute;
      left: 50%;
      bottom: 88px;
      max-width: 90%;
      border-radius: 9px;
      padding: 9px 14px;
      z-index: 2;
      font-size: 13px;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, 6px);
      transition: transform .18s, opacity .18s;
    }
    .toast.visible { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 730px) {
      body { display: block; }
      .gallery {
        padding: 8px 12px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-rows: 33px 42px;
        gap: 4px 8px;
        align-items: center;
      }
      .gallery-intro, .design-note { display: none; }
      .gallery-brand { gap: 7px; min-width: 0; }
      .gallery-brand strong { font-size: 15px; }
      .gallery-tag { margin-left: 2px; font-size: 11px; }
      .brand-mark { width: 27px; height: 27px; border-radius: 6px; }
      .brand-mark i { width: 19px; }
      .variant-list {
        grid-row: 2;
        grid-column: 1 / -1;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 4px;
      }
      .variant-list button {
        min-height: 42px;
        padding: 4px;
        gap: 6px;
        justify-content: center;
        border-radius: 8px;
        white-space: nowrap;
        font-size: 12px;
      }
      .variant-list .swatch { width: 19px; height: 19px; flex-basis: 19px; border-radius: 4px; }
      .variant-list .swatch::before { display: none; }
      .swatch-console { background: #354149; }
      .swatch-ledger { background: #dce5f8; }
      .swatch-focus { background: #ddceff; }
      .variant-list small, .choice-arrow { display: none; }
      .reset-link { grid-column: 2; grid-row: 1; margin: 0; min-height: 33px; font-size: 11px; }
      .stage { min-height: auto; display: block; padding: 0; }
      .device {
        width: 100%;
        height: calc(100svh - 95px);
        min-height: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
      .app-header { padding-inline: 15px; height: 49px; }
      .workout-body { scrollbar-gutter: auto; }
      .app-dock { padding: 9px 14px max(10px, env(safe-area-inset-bottom)); }
    }
    @media (max-width: 360px) {
      .variant-list .swatch { display: none; }
      .header-main { gap: 6px; }
      .app-header { gap: 5px; }
    }
    @media (max-height: 560px) and (max-width: 730px) {
      .device { min-height: 410px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .001ms !important; transition-duration: .001ms !important; }
    }

    /* 负重仪表：调整、确认、休息都围绕同一块仪表。 */
    .console-layout { padding: 20px 19px 14px; }
    .console-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
      gap: 6px;
    }
    .console-meta b { color: #ffc6a1; margin-left: 4px; }
    .console-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 54px;
      gap: 10px;
      margin: 2px 0 11px;
    }
    .console-title h2 {
      font-size: clamp(24px, 7vw, 30px);
      font-weight: 800;
      letter-spacing: -.052em;
      line-height: 1.26;
    }
    .art-link {
      min-height: 44px;
      padding: 0 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .art-link:hover { color: var(--ink); }
    .console-bay {
      min-height: 252px;
      overflow: hidden;
      padding: 14px 13px 12px;
      border: 1px solid #59656b;
      border-radius: 15px;
      background: radial-gradient(ellipse at 50% 0, #404c53, #323c43 78%);
      box-shadow: inset 0 1px 0 #75848a6e, 0 3px 10px #11181d30;
    }
    .bay-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 0 1px 10px;
      font-size: 12px;
      color: #e7ded5;
      font-weight: 800;
    }
    .bay-label .count { color: #ffc19e; }
    .console-wells {
      display: grid;
      grid-template-columns: 1.17fr 1fr;
      gap: 6px;
      background: #1a2023;
      padding: 5px;
      border: 1px solid #0e1518;
      border-radius: 11px;
      box-shadow: 0 1px 0 #566369;
    }
    .well {
      min-width: 0;
      padding: 7px 8px 8px;
      background: linear-gradient(#282a28, #252826 76%, #2b2f2d);
      box-shadow: inset 0 1px 0 #ffffff15;
      border-radius: 6px;
    }
    .well-label {
      margin-left: 4px;
      color: #cdc9b8;
      font-size: 12px;
      display: flex;
      gap: 4px;
      justify-content: space-between;
    }
    .well-label small { color: #b1afa4; font-size: 11px; }
    .well-value {
      display: block;
      width: 100%;
      padding: 0 4px 3px;
      text-align: left;
      color: #ffc799;
      font: 700 clamp(43px, 14.8vw, 62px)/.99 var(--narrow);
      font-variant-numeric: tabular-nums;
      letter-spacing: -.015em;
    }
    .well-value:hover { background: #ffc79913; }
    .well-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 7px; }
    .well-controls button {
      height: 44px;
      border: 1px solid #535955;
      border-radius: 6px;
      background: linear-gradient(#3f4645, #373e3f);
      box-shadow: 0 2px #171c20;
      font: 500 20px/1 var(--sans);
    }
    .well-controls button:hover { background: #505655; }
    .well-controls button:active { transform: translateY(2px); box-shadow: none; }
    .bay-history {
      min-height: 34px;
      margin-inline: 2px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #c4cbd0;
      font-size: 12px;
      gap: 6px;
    }
    .bay-history strong { color: #f4eee6; font: 500 12px var(--mono); }
    .plate-meter {
      display: flex;
      gap: 4px;
      margin: 0 2px;
      height: 4px;
    }
    .plate-meter i {
      flex: 1;
      background: #20282c;
      border-radius: 1px;
    }
    .plate-meter [data-state="done"] { background: #e5a477; }
    .plate-meter [data-state="current"] { background: #88807a; }
    .console-table { margin-top: 10px; }
    .console-table .section-title { margin-inline: 1px; }
    .console-row {
      display: grid;
      grid-template-columns: 1fr auto 27px;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 44px;
      padding: 0 9px;
      border-top: 1px solid var(--line);
      text-align: left;
      color: var(--muted);
      font-size: 13px;
    }
    .console-row b { font-weight: 750; }
    .console-row.is-current {
      color: var(--ink);
      background: #343c41;
      box-shadow: inset 2px 0 var(--action);
    }
    .console-row:hover { background: #343c41; }
    .console-row.is-done .check-sigil { color: #ffbd94; justify-self: center; }
    .console-row .chevron { justify-self: center; }
    .upcoming {
      display: flex;
      width: 100%;
      min-height: 49px;
      margin-top: 9px;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      gap: 8px;
      padding: 5px 10px;
      border-top: 1px solid var(--line);
      font-size: 13px;
    }
    .upcoming strong { margin-left: auto; font-size: 13px; font-weight: 800; }
    .upcoming .chevron { margin-inline: 6px 2px; }
    .console-rest {
      padding: 9px 11px 10px;
      background: #202523;
      border: 1px solid #141b1b;
      border-radius: 10px;
    }
    .console-rest-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .console-countdown {
      color: #ffc89a;
      font: 700 clamp(49px, 16vw, 74px)/.98 var(--narrow);
      letter-spacing: -.01em;
      font-variant-numeric: tabular-nums;
    }
    .console-rest .rest-adjust { display: flex; align-items: center; gap: 5px; }
    .rest-adjust button { font: 500 12px var(--mono); min-width: 45px; }
    .console-rest .sub-button { padding: 0 7px; border-radius: 6px; }
    .rest-gauge {
      position: relative;
      margin-top: 11px;
      height: 12px;
      color: #ffc89a;
      background: #3d4540;
      -webkit-mask-image: repeating-linear-gradient(90deg, #000 0 5px, transparent 5px 8px);
      mask-image: repeating-linear-gradient(90deg, #000 0 5px, transparent 5px 8px);
    }
    .rest-gauge i { display: block; height: 100%; width: var(--progress); background: currentColor; transition: width .22s linear; }
    .console-next {
      margin-top: 10px;
      padding: 8px 3px 0;
      border-top: 1px solid #4a555a;
    }
    .console-next strong { font-size: 13px; }
    .console-next > div { display: flex; align-items: center; justify-content: space-between; gap: 5px; }
    .console-next .minor { color: #c8d0d2; }
    .console-rest-preview {
      display: flex;
      justify-content: space-between;
      gap: 5px;
      margin-top: 8px;
      font-size: 12px;
    }
    .dock-list { flex: 0 0 auto; padding-inline: 12px; font-size: 13px; white-space: nowrap; }
    .dock-timer { flex: 0 0 auto; font: 500 12px var(--mono); }
    .console-dock .primary { font-size: 15px; }
    .console-dock .secondary { border: 1px solid #4b5860; }
    .console-dock .primary .check-sigil { margin-right: 2px; }

    /* 训练账本：按动作展开重量和历史，完成组后将计时插入记录。 */
    .ledger-layout { padding: 21px 20px 12px; }
    body[data-variant="ledger"] .header-main { color: var(--action); }
    body[data-variant="ledger"] .clock-pill { color: var(--action); background: #e9eef7; border-radius: 3px; }
    body[data-variant="ledger"] .finish-link { color: var(--action); }
    .ledger-title { margin-bottom: 14px; }
    .ledger-title > .minor { color: var(--muted); font-weight: 750; }
    .ledger-title h2 { font: 800 35px/1.31 var(--serif); letter-spacing: -.045em; margin: 1px 0 10px; }
    .ledger-led {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-block: 1px solid #7e93c6;
    }
    .ledger-led div { padding: 8px 2px; }
    .ledger-led div + div { border-left: 1px solid #afbedc; padding-left: 15px; }
    .ledger-led strong {
      font: 500 19px/1.12 var(--mono);
      color: var(--action);
      display: inline-block;
      vertical-align: baseline;
      margin-right: 6px;
    }
    .ledger-led .minor { display: block; margin-top: 2px; }
    .ledger-title .meter-line { margin-top: 8px; border-radius: 0; height: 2px; }
    .ledger-list > .section-title { color: var(--action); }
    .ledger-list > .section-title h3 { font-family: var(--serif); font-size: 17px; }
    .ledger-list > .section-title button { color: var(--action); }
    .ledger-article { border-top: 1px solid #acBada; }
    .ledger-article:last-child { border-bottom: 1px solid #acBada; }
    .ledger-exercise {
      display: grid;
      grid-template-columns: 22px 37px minmax(0, 1fr) auto 13px;
      width: 100%;
      text-align: left;
      align-items: center;
      min-height: 56px;
      gap: 8px;
      padding: 5px 3px;
      color: var(--ink);
    }
    .ledger-exercise:hover, .ledger-article.open .ledger-exercise { background: #e9eff9; }
    .ledger-exercise .count { font-size: 11px; color: #4b5d8a; }

    const listIcon = '<span class="list-sigil" aria-hidden="true"></span>';

    const escape = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    }[char]));
    const clean = (value) => Number(Number(value).toFixed(2));
    const rawNumber = (value) => value === null ? "—" : String(clean(value));
    const pad = (value) => String(value).padStart(2, "0");
    const secondsSince = (start, end = Date.now()) => Math.max(0, Math.floor((end - start) / 1000));
    const clock = (milliseconds) => clockSeconds(Math.max(0, Math.ceil(milliseconds / 1000)));
    const clockSeconds = (seconds) => {
      const hours = Math.floor(seconds / 3600);
      const mmss = `${pad(Math.floor(seconds / 60) % 60)}:${pad(seconds % 60)}`;
      return hours ? `${hours}:${mmss}` : mmss;
    };

    let serial = 0;
    let modal = null;
    let toastTimer;
    let slideGesture = null;
    let interruptedSlideClick = null;

    function seedSet(preset, values = {}) {
      return {
        id: `set-${++serial}`,
        weight: preset.weight, reps: preset.reps,
        previousWeight: preset.weight, previousReps: preset.reps,
        kind: "working", done: false, plannedRest: null, actualRest: null,
        ...values
      };
    }

    function makeExercise(code, exampleSets) {
      const preset = catalog[code];
      const sets = exampleSets?.map(values => seedSet(preset, values)) ??
        Array.from({length: 3}, () => seedSet(preset));
      return { id: `exercise-${++serial}`, code, ...preset, sets };
    }

    function exampleWorkout(variant) {
      const exercises = [
        makeExercise("BB_BENCH_PRESS", [
          {kind:"warmup", weight:35, reps:12, previousWeight:35, previousReps:12, done:true, actualRest:44},
          {weight:60, previousWeight:60, done:true, plannedRest:90, actualRest:84},
          {previousWeight:60}, {previousWeight:60},
          {weight:57.5, reps:10, previousWeight:55, previousReps:10}
        ]),
        makeExercise("INCLINE_DB_PRESS"),
        makeExercise("CABLE_LATERAL_RAISE"),
        makeExercise("TRICEP_PUSHDOWN")
      ];
      return {
        variant, exercises,
        activeId: exercises[0].id, selectedSet: null, ledgerExpanded: exercises[0].id,
        startedAt: Date.now() - 12 * 60_000 - 24_000, endedAt: null,
        rest: null, restFolded: false
      };
    }

    function readVariant() {
      const requested = new URL(location.href).searchParams.get("variant");
      return variantNames.includes(requested) ? requested : "console";
    }

    let state = exampleWorkout(readVariant());
    const currentExercise = () => state.exercises.find(item => item.id === state.activeId);
    const slots = () => state.exercises.flatMap(exercise => exercise.sets.map(set => ({exercise, set})));
    const lookup = (id) => slots().find(({set}) => set.id === id);
    const findExercise = (id) => state.exercises.find(exercise => exercise.id === id);
    const completed = (exercise) => exercise.sets.filter(set => set.done).length;
    const setNumber = (exercise, set) =>
      exercise.sets.slice(0, exercise.sets.indexOf(set) + 1).filter(item => item.kind !== "warmup").length;
    const setLabel = (exercise, set) => set.kind === "warmup" ? "热身组" : `第 ${setNumber(exercise, set)} 组`;
    const setCeiling = (exercise) => exercise.sets.filter(set => set.kind !== "warmup").length;
    const ordinal = (exercise) => state.exercises.indexOf(exercise) + 1;
    const previous = (set) => set.previousWeight === null ? "—" : `${rawNumber(set.previousWeight)} kg × ${rawNumber(set.previousReps)}`;
    const values = (set) => `${rawNumber(set.weight)} kg × ${rawNumber(set.reps)}`;
    const fieldLabel = (field) => field === "weight" ? "重量" : "次数";

    function currentSlot() {
      const exercise = currentExercise();
      const set = exercise.sets.find(item => item.id === state.selectedSet) ??
        exercise.sets.find(item => !item.done) ?? exercise.sets.at(-1);
      return {exercise, set};
    }

    function nextUnfinished(afterId) {
      const entries = slots();
      const at = entries.findIndex(({set}) => set.id === afterId);
      return entries.slice(at + 1).find(({set}) => !set.done) ?? entries.find(({set}) => !set.done);
    }

    function stats() {
      const all = slots();
      const recorded = all.filter(({set}) => set.done);
      const working = recorded.filter(({set}) => set.kind !== "warmup");
      return {
        total: all.length, done: recorded.length, working: working.length,
        loggedExercises: state.exercises.filter(exercise => completed(exercise) > 0).length,
        volume: working.reduce((sum, {set}) => sum + set.weight * set.reps, 0)
      };
    }

    function setSelection(exercise, set = null) {
      state.activeId = exercise.id;
      state.selectedSet = set?.id ?? null;
    }

    function switchVariant(variant, updateUrl = true) {
      if (!variantNames.includes(variant) || variant === state.variant) return;
      if (modal) closeSheet();
      state.variant = variant;
      if (updateUrl) {
        const url = new URL(location.href);
        url.searchParams.set("variant", variant);
        history.replaceState(null, "", url);
      }
      render({top:true, animate:true});
    }

    function changeExercise(exercise, {accordion = false} = {}) {
      setSelection(exercise);
      state.ledgerExpanded = accordion && state.ledgerExpanded === exercise.id ? null : exercise.id;
      if (state.rest && !accordion) state.restFolded = true;
      render({top: !accordion && state.variant !== "ledger", animate: state.variant === "focus"});
      if (accordion && state.ledgerExpanded) keepVisible(`[data-control="ledger-${exercise.id}"]`);
    }

    function selectSet(id) {
      const slot = lookup(id);
      if (!slot) return;
      setSelection(slot.exercise, slot.set);
      if (state.rest) state.restFolded = true;
      render();
    }

    function stepSet(offset) {
      const {exercise, set} = currentSlot();
      const next = exercise.sets[exercise.sets.indexOf(set) + offset];
      if (!next) return;
      setSelection(exercise, next);
      render({animate:true});
    }

    function addSet(exercise, focus = false) {
      const last = exercise.sets.at(-1);
      const set = seedSet(exercise, {
        weight: last?.weight ?? exercise.weight, reps: last?.reps ?? exercise.reps,
        previousWeight: null, previousReps: null
      });
      exercise.sets.push(set);
      setSelection(exercise, set);
      state.ledgerExpanded = exercise.id;
      if (state.rest) state.restFolded = true;
      render();
      if (focus) {
        openKeypad(set.id, "weight");
      } else {
        keepVisible(`[data-row="${set.id}"]`);
        notify("已加一组");
      }
    }

    function addExercise(code) {
      const exercise = makeExercise(code);
      exercise.sets.forEach(set => { set.previousWeight = null; set.previousReps = null; });
      state.exercises.push(exercise);
      closeSheet();
      changeExercise(exercise);
      if (state.variant === "ledger") keepVisible(`[data-control="ledger-${exercise.id}"]`);
      notify(`已添加${exercise.name}`);
    }

    function nudgeSet(id, field, direction) {
      const slot = lookup(id);
      const {set} = slot;
      const step = field === "weight" ? 2.5 : 1;
      const minimum = field === "weight" ? 0 : 1;
      const next = clean((set[field] ?? 0) + step * direction);
      set[field] = Math.min(field === "weight" ? 9999.99 : 9999, Math.max(minimum, next));
      render();
    }

    function restRemaining() {
      return state.rest ? Math.max(0, state.rest.endsAt - Date.now()) : 0;
    }

    function restPercent() {
      return state.rest ? Math.max(0, Math.min(100, restRemaining() / (state.rest.target * 10))) : 0;
    }

    function storeRest() {
      if (!state.rest) return;
      const rest = state.rest;
      const slot = lookup(rest.setId);
      if (slot?.set.done) {
        slot.set.plannedRest = rest.target;
        slot.set.actualRest = secondsSince(rest.startedAt, Math.min(Date.now(), rest.endsAt));
      }
      state.rest = null;
      state.restFolded = false;
    }

    function endRest(announce = true) {
      if (!state.rest) return;
      const expanded = !state.restFolded && state.variant !== "ledger";
      const next = expanded ? nextUnfinished(state.rest.setId) : null;
      storeRest();
      if (next) setSelection(next.exercise, next.set);
      render({animate:expanded});
      if (announce) notify("休息结束");
    }

    function adjustRest(change) {
      if (!state.rest) return;
      const rest = state.rest;
      rest.target = Math.max(10, Math.min(900, rest.target + change));
      rest.endsAt = rest.startedAt + rest.target * 1000;
      if (!restRemaining()) endRest();
      else updateClocks();
    }

    function revealRest() {
      if (!state.rest) return;
      state.restFolded = false;
      if (state.variant === "ledger") {
        state.ledgerExpanded = lookup(state.rest.setId).exercise.id;
        render();
        keepVisible(".ledger-rest");
      } else {
        render({top:true, animate:true});
      }
    }

    function toggleSet(id) {
      const slot = lookup(id);
      if (!slot) return;
      const {exercise, set} = slot;
      if (set.done) {
        if (state.rest?.setId === set.id) storeRest();
        set.done = false;
        set.plannedRest = null;
        set.actualRest = null;
        setSelection(exercise, set);
        render();
        notify(`已撤销${setLabel(exercise, set)}`);
        return;
      }
      if (set.weight === null || !(set.reps > 0)) {
        openKeypad(set.id, set.weight === null ? "weight" : "reps");
        return;
      }
      storeRest();
      set.done = true;
      const next = nextUnfinished(set.id);
      const preceding = exercise.sets[exercise.sets.indexOf(set) - 1];
      const inheritsRest = !exercise.restOverride && preceding?.kind === "working";
      const target = inheritsRest ? preceding.plannedRest ?? exercise.rest : exercise.rest;
      exercise.restOverride = false;
      if (next && target > 0) {
        const now = Date.now();
        state.rest = {setId: set.id, startedAt: now, target, endsAt: now + target * 1000};
        set.plannedRest = target;
      }
      state.ledgerExpanded = exercise.id;
      setSelection(next?.exercise ?? exercise, next?.set ?? set);
      render({animate:true});
      if (!next) notify("所有组已完成");
      else if (!state.rest) notify(`已记录${setLabel(exercise, set)}`);
    }

    function sessionClock() {
      return clockSeconds(secondsSince(state.startedAt, state.endedAt ?? Date.now()));
    }

    function recapSession() {
      closeSheet();
      storeRest();
      state.endedAt = Date.now();
      render({top:true, animate:true});
    }

    function resetSession() {
      closeSheet();
      state = exampleWorkout(state.variant);
      render({top:true, animate:true});
      notify("演示已重置");
    }

    function notify(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("visible");
      toastTimer = setTimeout(() => {
        toast.classList.remove("visible");
        toast.textContent = "";
      }, 1850);
    }

    function keepVisible(selector) {
      const target = viewport.querySelector(selector);
      if (!target) return;
      const bounds = viewport.getBoundingClientRect();
      const area = target.getBoundingClientRect();
      if (area.top < bounds.top || area.bottom > bounds.bottom) {
        target.scrollIntoView({block:"nearest", behavior:reducedMotion.matches ? "instant" : "smooth"});
      }
    }

    function updateClocks() {
      for (const clockLabel of device.querySelectorAll("[data-session-clock]")) {
        const value = sessionClock();
        if (clockLabel.textContent !== value) clockLabel.textContent = value;
      }
      if (!state.rest) return;
      const value = clock(restRemaining());
      for (const timer of device.querySelectorAll("[data-rest-clock]")) {
        if (timer.textContent !== value) timer.textContent = value;
      }
      for (const target of device.querySelectorAll("[data-rest-target]")) {
        const display = clockSeconds(state.rest.target);
        if (target.textContent !== display) target.textContent = display;
      }
      const progress = `${restPercent()}%`;
      for (const meter of device.querySelectorAll("[data-rest-progress]")) {
        meter.style.setProperty("--progress", progress);
      }
    }

    function button(content, action, attrs = "") {
      return `<button type="button" data-action="${action}" ${attrs}>${content}</button>`;
    }

    function artwork(exercise, alt = "") {
      return `<img src="${exerciseImages[exercise.code]}" width="288" height="288" alt="${escape(alt)}" draggable="false">`;
    }

    const restAdjust = () => [-10, 10].map(delta => button(
      `${delta < 0 ? "−" : "+"}10 秒`, "adjust-rest",
      `class="sub-button" data-delta="${delta}" data-control="rest-${delta}" aria-label="${delta < 0 ? "减少" : "增加"} 10 秒休息"`
    )).join("");

    function renderHeader() {
      const label = state.endedAt ? "已完成" : state.variant === "ledger" ? "训练中" : workoutName;
      return `<div class="header-main">
        <strong>${label}</strong>
        <span class="clock-pill" aria-label="${state.endedAt ? "训练时长" : "已训练时长"}">
          ${state.endedAt ? "" : '<i class="live-dot" aria-hidden="true"></i>'}
          <span data-session-clock>${sessionClock()}</span>
        </span>
      </div>
      ${state.endedAt ? '<span class="minor">训练记录</span>' :
        button("结束训练", "finish", 'class="finish-link" data-control="finish"')}`;
    }

    function renderConsole() {
      const current = currentSlot();
      const showRest = state.rest && !state.restFolded;
      const exercise = showRest ? lookup(state.rest.setId).exercise : current.exercise;
      const rows = exercise.sets.map(set => {
        const active = current.set.id === set.id;
        const status = set.done ? `已完成${set.actualRest ? `，休息 ${clockSeconds(set.actualRest)}` : ""}` : "待完成";
        return button(
          `<b>${setLabel(exercise, set)}${set.actualRest ? `<small class="actual-rest">休 ${clockSeconds(set.actualRest)}</small>` : ""}</b><span class="count">${values(set)}</span>${set.done ? checkIcon : chevron()}`,
          "pick-set", `class="console-row ${set.done ? "is-done" : ""} ${active ? "is-current" : ""}"
          data-id="${set.id}" data-row="${set.id}" data-control="pick-${set.id}"
          aria-label="${setLabel(exercise, set)}，${values(set)}，${status}" ${active ? 'aria-current="step"' : ""}`);
      }).join("");
      const upcoming = state.exercises[ordinal(exercise)];
      const plateMeter = exercise.sets.map(item =>
        `<i data-state="${item.done ? "done" : item === current.set ? "current" : "pending"}"></i>`
      ).join("");

      return `<article class="console-layout">
        <div class="console-meta">
          <span>动作 <b class="count">${pad(ordinal(exercise))} / ${pad(state.exercises.length)}</b></span>
          <span>${exercise.muscle} / ${exercise.gear}</span>
        </div>
        <div class="console-title">
          <h2>${exercise.name}</h2>
          ${button("动作示意", "exercise-detail", `class="art-link" data-id="${exercise.id}" data-control="detail-${exercise.id}"`)}
        </div>
        <section class="console-bay" data-phase-view aria-label="${showRest ? "休息计时" : "当前组记录"}">
          ${showRest ? renderConsoleRest() : renderConsoleValues(current)}
          <div class="plate-meter" aria-hidden="true">${plateMeter}</div>
        </section>
        <section class="console-table" aria-label="本动作组次">
          <div class="section-title">
            <h3>本动作组次 <span class="minor">${completed(exercise)}/${exercise.sets.length}</span></h3>
            ${button("<b aria-hidden='true'>＋</b> 加一组", "add-set", `class="inline-link" data-id="${exercise.id}" data-control="add-set-${exercise.id}"`)}
          </div>
          ${rows}
        </section>
        ${upcoming ? button(`<span class="minor">下个动作</span><strong>${upcoming.name}</strong>${chevron()}`,
          "select-exercise", `class="upcoming" data-id="${upcoming.id}" data-control="next-exercise"`) : ""}
      </article>`;
    }

    function renderConsoleValues({exercise, set}) {
      const fields = ["weight", "reps"].map(field => {
        const unit = field === "weight" ? "kg" : "次";
        const value = rawNumber(set[field]);
        return `<div class="well">
          <span class="well-label">${fieldLabel(field)}<small>${unit}</small></span>
          ${button(value, "edit", `class="well-value ${value.length > 5 ? "compact" : ""}"
            data-id="${set.id}" data-field="${field}" data-control="edit-${set.id}-${field}"
            aria-label="编辑${setLabel(exercise, set)}${fieldLabel(field)}，${value} ${unit}"`)}
          <div class="well-controls">
            ${[-1, 1].map(delta => button(delta < 0 ? "−" : "+", "nudge",
              `data-id="${set.id}" data-field="${field}" data-delta="${delta}"
              data-control="nudge-${field}-${delta}" aria-label="${delta < 0 ? "减少" : "增加"}${fieldLabel(field)}"`
            )).join("")}
          </div>
        </div>`;
      }).join("");
      return `<div class="bay-label"><span>${set.done ? "已记录" : "当前组"}</span>
          <span class="count">${set.kind === "warmup" ? "热身组" : `${pad(setNumber(exercise, set))} / ${pad(setCeiling(exercise))}`}</span>
        </div>
        <div class="console-wells">${fields}</div>
        <div class="bay-history"><span>上次${setLabel(exercise, set)}</span><strong>${previous(set)}</strong></div>`;
    }

    function renderConsoleRest() {
      const next = nextUnfinished(state.rest.setId);
      return `<div class="bay-label"><span>组间休息</span>
          <span class="count" data-rest-target>${clockSeconds(state.rest.target)}</span>
        </div>
        <div class="console-rest">
          <div class="console-rest-main">
            <strong class="console-countdown" data-rest-clock aria-label="休息剩余"></strong>
            <div class="rest-adjust">${restAdjust()}</div>
          </div>
          <div class="rest-gauge" data-rest-progress aria-hidden="true"><i></i></div>
          <div class="console-next">
            <div><span class="minor">接下来</span><strong>${next.exercise.name} ${setLabel(next.exercise, next.set)}</strong></div>
            <div><span></span><span class="count">${values(next.set)}</span></div>
          </div>
        </div>
        <div class="console-rest-preview">
          ${button("查看组次", "hide-rest", 'class="inline-link" data-control="hide-rest"')}
        </div>`;
    }

    function renderLedger() {
      const data = stats();
      const cards = state.exercises.map(exercise => {
        const isOpen = state.ledgerExpanded === exercise.id;
        return `<article class="ledger-article ${isOpen ? "open" : ""}">
          ${button(`<span class="count">${pad(ordinal(exercise))}</span>
              <span class="ledger-thumbnail">${artwork(exercise)}</span>
              <strong>${exercise.name}</strong>
              <span class="count">${completed(exercise)}/${exercise.sets.length}</span>
              ${chevron(isOpen ? "up" : "down")}`,
            "accordion", `class="ledger-exercise" data-id="${exercise.id}" data-control="ledger-${exercise.id}"
              aria-expanded="${isOpen}" aria-label="${exercise.name}，已完成 ${completed(exercise)} 组，共 ${exercise.sets.length} 组"`)}
          ${isOpen ? renderLedgerGroups(exercise) : ""}
        </article>`;
      }).join("");
      return `<article class="ledger-layout">
        <div class="ledger-title">
          <span class="minor">训练记录</span>
          <h2>${workoutName}</h2>
          <div class="ledger-led">
            <div><strong>${pad(data.done)} / ${pad(data.total)}</strong><span class="minor">已记录组次</span></div>
            <div><strong>${numberFormat.format(data.volume)}</strong> kg<span class="minor">正式组训练量</span></div>
          </div>
          <div class="meter-line" style="--progress:${data.done / data.total * 100}%" aria-hidden="true"><i></i></div>
        </div>
        <section class="ledger-list" aria-label="训练动作">
          <div class="section-title">
            <h3>动作 <span class="minor">${state.exercises.length}</span></h3>
            ${button("调整顺序", "queue", 'class="inline-link" data-mode="order" data-control="queue"')}
          </div>
          ${cards}
        </section>
      </article>`;
    }

    function renderLedgerGroups(exercise) {
      const current = currentSlot().set;
      const rows = exercise.sets.map(set => {
        const warm = set.kind === "warmup";
        const label = setLabel(exercise, set);
        const history = set.previousWeight === null ? "—" : `${rawNumber(set.previousWeight)} × ${rawNumber(set.previousReps)}`;
        const cells = ["weight", "reps"].map(field => {
          const value = rawNumber(set[field]);
          return `<span role="cell" class="stretch">${button(value, "edit",
            `class="ledger-field ${value.length > 5 ? "tiny" : ""}" data-id="${set.id}" data-field="${field}"
              data-control="edit-${set.id}-${field}" aria-label="编辑${label}${fieldLabel(field)}，${value}"`)}
          </span>`;
        }).join("");
        return `<div class="ledger-row ${current.id === set.id ? "is-current" : ""}" role="row" data-row="${set.id}">
          <span role="cell" class="set-label ${warm ? "warm" : ""}">
            ${warm ? "热身" : pad(setNumber(exercise, set))}
            ${set.actualRest ? `<small class="actual-rest" aria-label="本次休息 ${clockSeconds(set.actualRest)}">${clockSeconds(set.actualRest)}</small>` : ""}
          </span>
          <span role="cell" class="prev-value">${history}</span>
          ${cells}
          <span role="cell">${button(`<span aria-hidden="true">${set.done ? "✓" : ""}</span>`, "toggle-set",
            `class="ledger-check" data-id="${set.id}" data-control="complete-${set.id}"
            aria-pressed="${set.done}" aria-label="${label}${set.done ? "已完成，点击撤销" : "标记完成"}"`)}
          </span>
        </div>
        ${state.rest?.setId === set.id ? renderLedgerRest() : ""}`;
      }).join("");
      return `<div class="ledger-table" role="table" aria-label="${exercise.name}记录">
        <div class="ledger-row ledger-titles" role="row">
          <span role="columnheader">组</span><span role="columnheader">上次</span><span role="columnheader">kg</span>
          <span role="columnheader">次数</span><span role="columnheader">完成</span>
        </div>${rows}
      </div>
      <div class="ledger-add">
        ${button("<b aria-hidden='true'>＋</b> 加一组", "add-set", `class="inline-link" data-id="${exercise.id}" data-control="add-set-${exercise.id}"`)}
        ${button("动作示意与休息", "exercise-detail", `class="inline-link" data-id="${exercise.id}" data-control="detail-${exercise.id}"`)}
      </div>`;
    }

    function renderLedgerRest() {
      const next = nextUnfinished(state.rest.setId);
      return `<div class="ledger-rest" role="row" aria-label="休息计时">
        <div role="cell" aria-colspan="5">
          <div class="ledger-rest-top">
            <div><span class="minor">休息</span><strong class="count" data-rest-clock></strong></div>
            <div class="rest-adjust">${restAdjust()}</div>
          </div>
          <div class="meter-line" data-rest-progress aria-hidden="true"><i></i></div>
          <div class="ledger-rest-tail">
            <span>${next.exercise.name} ${setLabel(next.exercise, next.set)}</span>
            ${button("结束休息", "end-rest", 'class="inline-link" data-control="end-rest"')}
          </div>
        </div>
      </div>`;
    }

    function renderFocus() {
      const {exercise, set} = currentSlot();
      const showRest = state.rest && !state.restFolded;
      const steps = state.exercises.map(item => button("<span aria-hidden='true'></span>", "select-exercise",
        `data-id="${item.id}" data-control="focus-${item.id}" aria-label="切换到${item.name}"
          ${completed(item) === item.sets.length ? 'class="is-done"' : ""}
          ${item.id === exercise.id ? 'aria-current="step"' : ""}`
      )).join("");
      return `<article class="focus-layout">
        <div class="focus-progress">
          <span>动作 ${pad(ordinal(exercise))} / ${pad(state.exercises.length)}</span>
          <div>${steps}</div>
        </div>
        ${showRest ? renderFocusRest() : renderFocusSet(exercise, set)}
      </article>`;
    }

    function renderFocusSet(exercise, set) {
      const currentIndex = exercise.sets.indexOf(set);
      const upcoming = state.exercises[ordinal(exercise)];
      const fields = ["weight", "reps"].map(field => {
        const value = rawNumber(set[field]);
        return button(`<span>${fieldLabel(field)}</span><strong>${value}</strong><small>${field === "weight" ? "kg" : "次"}</small>`,
          "edit", `class="focus-value" data-id="${set.id}" data-field="${field}"
            data-control="edit-${set.id}-${field}" aria-label="编辑${setLabel(exercise, set)}${fieldLabel(field)}，${value}"`);
      }).join("");
      return `<figure class="focus-hero" data-phase-view>
        <div class="focus-hero-head"><p>${exercise.muscle} / ${exercise.gear}</p><h2>${exercise.name}</h2></div>
        ${artwork(exercise)}
        ${button("动作示意", "exercise-detail", `class="focus-art-button" data-id="${exercise.id}" data-control="detail-${exercise.id}"`)}
      </figure>
      <div class="focus-stepper" data-row="${set.id}">
        ${button(chevron(), "step-set", `data-delta="-1" data-control="prev-set" aria-label="上一组" ${currentIndex === 0 ? "disabled" : ""}`)}
        <div><strong>${setLabel(exercise, set)}${set.done ? " ✓" : ""}</strong><small class="minor">${set.done ? "已记录，" : ""}共 ${setCeiling(exercise)} 个正式组</small></div>
        ${button(chevron(), "step-set", `data-delta="1" data-control="next-set" aria-label="下一组"
          ${currentIndex === exercise.sets.length - 1 ? "disabled" : ""}`)}
      </div>
      <div class="focus-values">${fields}</div>
      <div class="focus-history">
        <span class="minor">上次${setLabel(exercise, set)} <b>${previous(set)}</b></span>
        ${button("＋ 加一组", "add-set", `class="inline-link" data-id="${exercise.id}" data-control="add-set-${exercise.id}"`)}
      </div>
      ${upcoming ? button(`${artwork(upcoming)}<span><small class="minor">下个动作</small>
        <strong>${upcoming.name}</strong></span>${chevron()}`, "select-exercise",
        `class="focus-next focus-upcoming" data-id="${upcoming.id}" data-control="next-exercise"`) : ""}`;
    }

    function renderFocusRest() {
      const next = nextUnfinished(state.rest.setId);
      return `<div class="focus-hero focus-rest-hero" data-phase-view>
          <div class="focus-hero-head"><p>组间休息</p></div>
          <div class="focus-orbit" data-rest-progress>
            <div><strong data-rest-clock aria-label="休息剩余"></strong><small>剩余时间</small></div>
          </div>
        </div>
        <div class="focus-rest-adjust rest-adjust">${restAdjust()}</div>
        <div class="focus-next">
          ${artwork(next.exercise)}
          <div><span class="minor">接下来</span><strong>${next.exercise.name} ${setLabel(next.exercise, next.set)}</strong></div>
          <span class="count">${values(next.set)}</span>
        </div>
        ${button("查看组次", "hide-rest", 'class="inline-link" data-control="hide-rest"')}`;
    }

    function renderDock() {
      if (state.endedAt) return button("重新体验", "reset", 'class="primary stretch" data-control="reset-summary"');
      const rest = state.rest;
      const showRest = rest && !state.restFolded;
      const timerShortcut = button('<span data-rest-clock></span>', "show-rest",
        'class="secondary dock-timer" data-control="show-rest" aria-label="查看休息计时"');
      if (state.variant === "ledger") {
        const inlineRest = rest && lookup(rest.setId).exercise.id === state.ledgerExpanded;
        return `${button("＋ 添加动作", "add-exercise", 'class="primary stretch" data-control="add-exercise"')}
          ${rest && !inlineRest ? timerShortcut : ""}`;
      }
      const queue = button(`${listIcon} 动作`, "queue", 'class="secondary dock-list" data-control="queue" aria-label="查看训练动作列表"');
      const {exercise, set} = currentSlot();
      const label = setLabel(exercise, set);
      const copy = `${set.done ? "撤销" : "完成"}${label}`;
      let main;
      if (showRest) {
        main = button("结束休息", "end-rest", 'class="primary stretch" data-control="end-rest"');
      } else if (state.variant === "focus" && !set.done) {
        main = button(`<span class="slide-thumb" aria-hidden="true">→</span>
            <span class="slide-label">滑动完成${label}<small>也可点按</small></span>`,
          "toggle-set", `class="slide-complete stretch" data-id="${set.id}" data-control="primary-set" aria-label="滑动或点按完成${label}"`);
      } else {
        main = button(`${set.done ? "" : checkIcon}${copy}`, "toggle-set",
          `class="primary stretch" data-id="${set.id}" data-control="primary-set"`);
      }
      return queue + (rest && !showRest ? timerShortcut : "") + main;
    }

    function renderRecap() {
      const data = stats();
      const exercises = state.exercises.filter(exercise => completed(exercise) > 0);
      return `<article class="recap" data-phase-view>
        <div class="recap-mark" aria-hidden="true">✓</div>
        <h2>训练已完成</h2>
        <p class="minor">${workoutName}</p>
        <section class="recap-stats" aria-label="本次训练统计">
          <div><strong data-session-clock>${sessionClock()}</strong><span class="minor">训练时长</span></div>
          <div><strong>${data.working}</strong><span class="minor">已完成正式组</span></div>
          <div><strong>${numberFormat.format(data.volume)}</strong><span class="minor">训练量 kg</span></div>
        </section>
        ${!exercises.length ? '<p class="recap-empty">本次没有完成的组。</p>' : ""}
        ${exercises.map(exercise => `<section class="recap-exercise">
          <h3>${exercise.name}</h3><span>${completed(exercise)} 组</span>
          <div>${exercise.sets.filter(set => set.done).map(set => `<span>${set.kind === "warmup" ? "热身 " : ""}${values(set)}</span>`).join("")}</div>
        </section>`).join("")}
      </article>`;
    }

    function render({top = false, animate = false} = {}) {
      const control = document.activeElement?.dataset.control;
      document.body.dataset.variant = state.variant;
      for (const option of document.querySelectorAll("[data-variant-choice]")) {
        option.setAttribute("aria-pressed", option.dataset.variantChoice === state.variant);
      }
      const design = variants[state.variant];
      document.querySelector("#design-description").textContent = design.description;
      const reference = document.querySelector("#design-reference");
      reference.textContent = design.reference[0];
      reference.href = `https://60fps.design/appsites/${design.reference[1]}`;
      header.innerHTML = renderHeader();
      viewport.innerHTML = state.endedAt ? renderRecap() :
        {console: renderConsole, ledger: renderLedger, focus: renderFocus}[state.variant]();
      dock.className = `app-dock ${state.variant}-dock`;
      dock.innerHTML = renderDock();
      if (top) viewport.scrollTop = 0;
      updateClocks();
      if (control && !sheet.open) {
        const target = device.querySelector(`[data-control="${control}"]:not(:disabled)`);
        const phaseControl = ["primary-set", "end-rest", "show-rest", "hide-rest"].includes(control);
        const replacement = phaseControl ? dock.querySelector(".primary, .slide-complete") : null;
        (target ?? replacement)?.focus({preventScroll:true});
      }
      if (animate && !reducedMotion.matches) {
        const element = viewport.querySelector("[data-phase-view], .ledger-rest");
        element?.animate(
          [{opacity:.68, transform:"translateY(4px) scale(.989)"}, {opacity:1, transform:"none"}],
          {duration:230, easing:"cubic-bezier(.22,.68,.2,1)"}
        );
      }
    }

    function sheetPosition() {
      const bounds = device.getBoundingClientRect();
      const screen = window.visualViewport;
      const visibleBottom = (screen?.height ?? innerHeight) + (screen?.offsetTop ?? 0);
      const mobile = matchMedia("(max-width: 730px)").matches;
      const bottom = Math.min(bounds.bottom - (mobile ? 0 : 4), visibleBottom);
      sheet.style.setProperty("--sheet-width", `${bounds.width - (mobile ? 0 : 10)}px`);
      sheet.style.setProperty("--sheet-center", `${bounds.left + bounds.width / 2}px`);
      sheet.style.setProperty("--sheet-bottom", `${innerHeight - bottom}px`);
      sheet.style.setProperty("--sheet-height", `${Math.max(100, bottom - Math.max(0, bounds.top) - 5)}px`);
    }

    function sheetContent(title, contents, closeLabel = "") {
      return `<div class="sheet-inner">
        <div class="sheet-head">
          <h2 id="sheet-title">${title}</h2>
          ${button(closeLabel || "×", "close-sheet",
            `${closeLabel ? 'class="text-close"' : ""} aria-label="${closeLabel || "关闭"}" data-control="close-sheet"`)}
        </div>${contents}
      </div>`;
    }

    function showSheet(kind, details = {}) {
      const returnControl = modal?.returnControl ?? document.activeElement?.dataset.control;
      modal = {kind, returnControl, ...details};
      sheetPosition();
      renderSheet();
      if (!sheet.open) sheet.showModal();
      sheet.scrollTop = 0;
      sheet.querySelector('[data-control="close-sheet"]')?.focus({preventScroll:true});
    }

    function closeSheet() {
      const returnControl = modal?.returnControl;
      modal = null;
      if (sheet.open) sheet.close();
      if (returnControl) device.querySelector(`[data-control="${returnControl}"]`)?.focus({preventScroll:true});
    }

    function endSheet(wantsReset) {
      if (wantsReset) {
        return sheetContent("重置演示？", `<p class="sheet-copy">恢复开场时的训练进度、动作顺序和示例重量。</p>
          <div class="sheet-actions">
            ${button("返回", "close-sheet", 'class="secondary"')}
            ${button("重置演示", "reset", 'class="primary"')}
          </div>`);
      }
      const data = stats();
      const remaining = data.total - data.done;
      return sheetContent("结束训练？", `<p class="sheet-copy">${remaining
        ? `还有 <strong>${remaining} 组未完成</strong>。结束后，摘要只保留已完成的组。`
        : "本次所有组均已完成。结束后可以查看训练摘要。"}</p>
        <div class="finish-counts">
          <div><strong>${data.loggedExercises}</strong><span class="minor">已记录动作</span></div>
          <div><strong>${data.done}</strong><span class="minor">已完成组</span></div>
        </div>
        <div class="sheet-actions">
          ${button("继续训练", "close-sheet", 'class="secondary"')}
          ${button("确认结束", "finish-confirmed", 'class="primary"')}
        </div>`);
    }

    function queueSheet() {
      const ordered = modal.order;
      return sheetContent(ordered ? "调整动作顺序" : "训练动作", `
        <div class="sheet-list">
        ${state.exercises.map((exercise, index) => `<div class="sheet-row ${exercise.id === state.activeId ? "selected" : ""}">
          <span class="ordinal" aria-hidden="true">${pad(index + 1)}</span>
          ${button(`${artwork(exercise)}<div><strong>${exercise.name}</strong>
            <span class="minor">${completed(exercise)} / ${exercise.sets.length} 组已记录</span></div>
            ${!ordered ? chevron() : ""}`, "queue-pick", `class="sheet-picker-row" data-id="${exercise.id}"`)}
          ${ordered ? `<div class="queue-order">
            ${[-1, 1].map(delta => button(delta < 0 ? "↑" : "↓", "move-exercise",
              `data-id="${exercise.id}" data-delta="${delta}" data-control="move-${exercise.id}-${delta}"
                aria-label="${delta < 0 ? "上移" : "下移"}${exercise.name}" ${state.exercises[index + delta] ? "" : "disabled"}`
            )).join("")}
          </div>` : ""}
        </div>`).join("")}
        </div>
        <div class="sheet-actions">
          ${button(ordered ? "完成排序" : "调整顺序", ordered ? "close-sheet" : "queue-order", 'class="secondary"')}
          ${button("添加动作", "add-exercise", 'class="primary"')}
        </div>`);
    }

    function libraryResults(query) {
      const key = query.trim().toLocaleLowerCase();
      const matches = Object.entries(catalog).filter(([, exercise]) =>
        `${exercise.name} ${exercise.muscle} ${exercise.gear}`.toLocaleLowerCase().includes(key));
      if (!matches.length) return '<p class="search-empty">没有找到动作，试试动作名或器械。</p>';
      return matches.map(([code, exercise]) => `<div class="sheet-row">
        ${button(`${artwork({code})}<div><strong>${exercise.name}</strong>
          <span class="minor">${exercise.muscle} / ${exercise.gear}</span></div><b aria-hidden="true">＋</b>`,
          "library-pick", `class="sheet-picker-row" data-id="${code}" aria-label="添加${exercise.name}"`)}
      </div>`).join("");
    }

    function librarySheet() {
      return sheetContent("添加动作", `
        <input type="search" class="sheet-search" id="exercise-search" placeholder="搜索动作、部位或器械" aria-label="搜索动作、部位或器械" autocomplete="off">
        <div class="sheet-list" id="library-results">${libraryResults("")}</div>`);
    }

    function detailsSheet() {
      const exercise = findExercise(modal.exerciseId);
      return sheetContent(exercise.name, `<div class="sheet-art">${artwork(exercise, `${exercise.name}动作示意`)}</div>
        <p class="sheet-copy">${exercise.muscle} / ${exercise.gear}</p>
        <h3 class="sheet-settings-title">组间休息</h3>
        <div class="rest-preset">
          ${[0, 30, 60, 90, 120].map(value => button(value ? `${value} 秒` : "关闭", "rest-preset",
            `data-delta="${value}" data-id="${exercise.id}" data-control="preset-${value}" aria-pressed="${exercise.rest === value}"`
          )).join("")}
        </div>
        <p class="minor" style="margin-top:8px">此设置用于当前动作的后续组。</p>`);
    }

    function keypadSheet() {
      const {exercise, set} = lookup(modal.setId);
      const first = exercise.sets[0] === set && modal.field === "weight";
      return sheetContent(`编辑${fieldLabel(modal.field)}`, `
        <div class="keypad-readout">
          <div><span class="minor">${exercise.name}</span><span class="minor">${setLabel(exercise, set)}</span></div>
          <strong data-keypad-value>${modal.buffer || "—"}</strong>
        </div>
        <div class="keypad-navigation">
          ${button("上一项", "key-field", `class="sub-button" data-delta="-1" data-control="key-prev" ${first ? "disabled" : ""}`)}
          ${button("下一项", "key-field", 'class="sub-button" data-delta="1" data-control="key-next"')}
          ${button("加一组", "key-add", 'class="sub-button" data-control="key-add"')}
        </div>
        <div class="keypad-grid">
          ${["1","2","3","4","5","6","7","8","9",".","0","⌫"].map(key => button(key, "key-type",
            `data-key="${key}" aria-label="${key === "⌫" ? "删除一位" : key === "." ? "小数点" : key}"
              ${key === "." && modal.field === "reps" ? "disabled" : ""}`
          )).join("")}
        </div>`, "收起");
    }

    function renderSheet() {
      const renderers = {
        finish: () => endSheet(false), reset: () => endSheet(true), queue: queueSheet,
        library: librarySheet, detail: detailsSheet, keypad: keypadSheet
      };
      sheet.innerHTML = renderers[modal.kind]();
    }

    function openKeypad(id, field) {
      const {exercise, set} = lookup(id);
      const buffer = set[field] === null ? "" : String(set[field]);
      setSelection(exercise, set);
      showSheet("keypad", {setId:id, field, buffer, replace:true});
    }

    function keyType(key) {
      const {field, replace, buffer, setId} = modal;
      if (key === "." && field !== "weight") return;
      const draft = replace && key !== "⌫" ? "" : buffer;
      let value;
      if (key === "⌫") value = draft.slice(0, -1);
      else if (key === ".") value = draft.includes(".") ? draft : `${draft || "0"}.`;
      else value = /^[0-9]$/.test(key) ? `${draft === "0" ? "" : draft}${key}` : draft;
      if (!/^\d{0,4}(\.\d{0,2})?$/.test(value)) return;
      modal.buffer = value;
      modal.replace = false;
      lookup(setId).set[field] = value ? Number(value) : null;
      sheet.querySelector("[data-keypad-value]").textContent = value || "—";
      render();
    }

    function stepField(delta) {
      const {exercise, set} = lookup(modal.setId);
      const fields = exercise.sets.flatMap(item => [
        {id:item.id, field:"weight"}, {id:item.id, field:"reps"}
      ]);
      const at = fields.findIndex(item => item.id === set.id && item.field === modal.field);
      const next = fields[at + delta];
      if (next) {
        const control = document.activeElement?.dataset.control;
        openKeypad(next.id, next.field);
        if (control) sheet.querySelector(`[data-control="${control}"]:not(:disabled)`)?.focus({preventScroll:true});
      } else if (delta > 0) closeSheet();
    }

    function moveExercise(id, delta) {
      const index = state.exercises.findIndex(exercise => exercise.id === id);
      const neighbor = index + delta;
      if (neighbor < 0 || neighbor >= state.exercises.length) return;
      [state.exercises[index], state.exercises[neighbor]] = [state.exercises[neighbor], state.exercises[index]];
      const control = document.activeElement?.dataset.control;
      const offset = sheet.scrollTop;
      render();
      renderSheet();
      sheet.scrollTop = offset;
      sheet.querySelector(`[data-control="${control}"]:not(:disabled), [data-control="move-${id}-${-delta}"]:not(:disabled)`)?.focus({preventScroll:true});
    }

    function handleAction(element) {
      const {action, id, field, delta, mode, key} = element.dataset;
      switch (action) {
        case "ask-reset": showSheet("reset"); break;
        case "reset": resetSession(); break;
        case "finish": showSheet("finish"); break;
        case "finish-confirmed": recapSession(); break;
        case "close-sheet": closeSheet(); break;
        case "queue": showSheet("queue", {order:mode === "order"}); break;
        case "queue-pick": closeSheet(); changeExercise(findExercise(id)); break;
        case "queue-order": showSheet("queue", {order:true}); break;
        case "move-exercise": moveExercise(id, Number(delta)); break;
        case "add-exercise": showSheet("library"); break;
        case "library-pick": addExercise(id); break;
        case "select-exercise": changeExercise(findExercise(id)); break;
        case "accordion": changeExercise(findExercise(id), {accordion:true}); break;
        case "pick-set": selectSet(id); break;
        case "step-set": stepSet(Number(delta)); break;
        case "toggle-set": toggleSet(id); break;
        case "add-set": addSet(findExercise(id)); break;
        case "exercise-detail": showSheet("detail", {exerciseId:id}); break;
        case "nudge": nudgeSet(id, field, Number(delta)); break;
        case "edit": openKeypad(id, field); break;
        case "key-type": keyType(key); break;
        case "key-field": stepField(Number(delta)); break;
        case "key-add": addSet(lookup(modal.setId).exercise, true); break;
        case "rest-preset": {
          const exercise = findExercise(id);
          exercise.rest = Number(delta);
          exercise.restOverride = true;
          sheet.querySelectorAll('[data-action="rest-preset"]').forEach(preset =>
            preset.setAttribute("aria-pressed", Number(preset.dataset.delta) === exercise.rest));
          break;
        }
        case "adjust-rest": adjustRest(Number(delta)); break;
        case "end-rest": endRest(); break;
        case "hide-rest": state.restFolded = true; render({animate:true}); break;
        case "show-rest": revealRest(); break;
      }
    }

    document.addEventListener("click", (event) => {
      const choice = event.target.closest("[data-variant-choice]");
      if (choice) {
        switchVariant(choice.dataset.variantChoice);
        return;
      }
      const element = event.target.closest("[data-action]");
      if (!element || element.disabled) return;
      if (interruptedSlideClick === element) {
        interruptedSlideClick = null;
        if (event.detail) return;
      }
      handleAction(element);
    });

    sheet.addEventListener("click", (event) => {
      if (event.target === sheet) {
        const rect = sheet.getBoundingClientRect();
        if (event.clientX < rect.left || event.clientX > rect.right ||
            event.clientY < rect.top || event.clientY > rect.bottom) closeSheet();
      }
    });

    sheet.addEventListener("input", (event) => {
      if (event.target.id === "exercise-search") {
        sheet.querySelector("#library-results").innerHTML = libraryResults(event.target.value);
        sheet.scrollTop = 0;
      }
    });

    sheet.addEventListener("cancel", (event) => {
      event.preventDefault();
      closeSheet();
    });

    document.addEventListener("keydown", (event) => {
      if (event.ctrlKey || event.altKey || event.metaKey) return;
      if (modal?.kind === "keypad") {
        if (/^\d$/.test(event.key) || event.key === "." || event.key === "Backspace") {
          event.preventDefault();
          keyType(event.key === "Backspace" ? "⌫" : event.key);

        }
        return;
      }
      if (modal || event.target.matches("input, textarea, [contenteditable]")) return;
      if (event.target.closest(".variant-list") && (event.key === "ArrowLeft" || event.key === "ArrowRight")) {
        event.preventDefault();
        const offset = event.key === "ArrowLeft" ? -1 : 1;
        const index = (variantNames.indexOf(state.variant) + offset + variantNames.length) % variantNames.length;
        const variant = variantNames[index];
        switchVariant(variant);
        document.querySelector(`[data-variant-choice="${variant}"]`).focus();
      }
    });

    // 短滑返回原位，越过阈值才通过滑动完成。点按和键盘共用普通按钮路径。
    dock.addEventListener("pointerdown", (event) => {
      const button = event.target.closest(".slide-complete");
      if (!button || !event.isPrimary || event.button !== 0) return;
      interruptedSlideClick = null;
      const travel = Math.max(1, button.clientWidth - 53);
      slideGesture = {button, start:event.clientX, pointerId:event.pointerId, travel, moved:false};
      button.setPointerCapture(event.pointerId);
    });

    dock.addEventListener("pointermove", (event) => {
      const gesture = slideGesture;
      if (!gesture || gesture.pointerId !== event.pointerId) return;
      const delta = event.clientX - gesture.start;
      if (Math.abs(delta) > 6) gesture.moved = true;
      if (!gesture.moved) return;
      const offset = Math.max(0, Math.min(gesture.travel, delta));
      gesture.button.classList.add("dragging");
      gesture.button.style.setProperty("--drag", `${offset}px`);
      gesture.button.style.setProperty("--slide-fill", `${(offset + 24) / (gesture.travel + 53) * 100}%`);
    });

    function finishSlide(event) {
      const gesture = slideGesture;
      if (!gesture || gesture.pointerId !== event.pointerId) return;
      slideGesture = null;
      gesture.button.classList.remove("dragging");
      gesture.button.style.removeProperty("--drag");
      gesture.button.style.removeProperty("--slide-fill");
      if (!gesture.moved) return;
      interruptedSlideClick = gesture.button;
      if (event.type === "pointerup" && event.clientX - gesture.start >= gesture.travel * .72) {
        toggleSet(gesture.button.dataset.id);
      }
    }

    dock.addEventListener("pointerup", finishSlide);
    dock.addEventListener("pointercancel", finishSlide);
    dock.addEventListener("lostpointercapture", finishSlide);
    window.addEventListener("resize", () => { if (sheet.open) sheetPosition(); });
    window.visualViewport?.addEventListener("resize", () => { if (sheet.open) sheetPosition(); });
    window.addEventListener("scroll", () => { if (sheet.open) sheetPosition(); }, {passive:true});
    window.addEventListener("popstate", () => switchVariant(readVariant(), false));

    render();
    setInterval(() => {
      if (state.rest && !restRemaining()) endRest();
      else updateClocks();
    }, 200);

  </script>
