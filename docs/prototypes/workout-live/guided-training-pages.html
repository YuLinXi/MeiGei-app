    :root {
      --paper: #f7f3ff;
      --white: #fdfbff;
      --rail: #fcf9ff;
      --ink: #282043;
      --muted: #625879;
      --line: #e1d8f5;
      --line-strong: #cbbbe6;
      --surface: #ede5fe;
      --action: #5537ad;
      --action-hover: #6749bc;
      --action-deep: #3d2673;
      --stage-floor: #d1c3f0;
      --stage-light: #f4ddec;
      --stage-deep: #a99cde;
      --hero-glow: #f5dcef;
      --hero-base: #e1d7fd;
      --hero-tint: #c4b4f5;
      --hero-cool: #bfc9f1;
      --hero-warm: #e9bfda;
      --rest-glow: #ffe4eb;
      --focus-ring: var(--action);
      --action-ink: #fff;
      --surface-soft: color-mix(in srgb, var(--action) 5%, var(--paper));
      --indicator: color-mix(in srgb, var(--action) 43%, var(--hero-base));
      --soft-ink: color-mix(in srgb, var(--ink) 65%, var(--action));
      --hero-ring: color-mix(in srgb, var(--action) 14%, transparent);
      --stage-ring: color-mix(in srgb, var(--action) 7%, transparent);
      --shadow: color-mix(in srgb, var(--ink) 26%, transparent);
      --glass: color-mix(in srgb, var(--white) 83%, transparent);
      --glass-light: color-mix(in srgb, var(--white) 66%, transparent);
      --cool-base: color-mix(in srgb, var(--hero-cool) 42%, var(--white));
      --warm-base: color-mix(in srgb, var(--hero-warm) 38%, var(--white));
    }

    :root[data-theme="ocean"] {
      --paper: #f1f7ff;
      --white: #fcfdff;
      --rail: #f7fbff;
      --ink: #142b44;
      --muted: #4c6278;
      --line: #d2e1ef;
      --line-strong: #a8c5e0;
      --surface: #e6f1fb;
      --action: #245889;
      --action-hover: #326ba0;
      --action-deep: #1a426d;
      --stage-floor: #bad4ed;
      --stage-light: #e0f4f8;
      --stage-deep: #83b1d8;
      --hero-glow: #e3f7fa;
      --hero-base: #d3e8f9;
      --hero-tint: #accee9;
      --hero-cool: #aec0ed;
      --hero-warm: #d5d2ea;
      --rest-glow: #e2f8fb;
    }

    :root[data-theme="pine"] {
      --paper: #f1f7ee;
      --white: #fdfff9;
      --rail: #f9fcf5;
      --ink: #20392c;
      --muted: #4a6657;
      --line: #d5e6d6;
      --line-strong: #aac9b2;
      --surface: #e4f1e4;
      --action: #21664f;
      --action-hover: #28775d;
      --action-deep: #1b503f;
      --stage-floor: #bfdac6;
      --stage-light: #eef3d9;
      --stage-deep: #89b09a;
      --hero-glow: #eff5d5;
      --hero-base: #ddeddc;
      --hero-tint: #b8d8bf;
      --hero-cool: #b3d7ce;
      --hero-warm: #dfd1ac;
      --rest-glow: #eef5db;
    }

    :root[data-theme="apricot"] {
      --paper: #fff5ef;
      --white: #fffdf9;
      --rail: #fdf9f4;
      --ink: #492a24;
      --muted: #78584f;
      --line: #eed7ce;
      --line-strong: #dfb4a5;
      --surface: #fae8e0;
      --action: #a1432e;
      --action-hover: #b4513b;
      --action-deep: #803424;
      --stage-floor: #f0c6b6;
      --stage-light: #ffe7cc;
      --stage-deep: #d99b8f;
      --hero-glow: #ffe8ca;
      --hero-base: #fbe1d3;
      --hero-tint: #f6beac;
      --hero-cool: #e8c6bd;
      --hero-warm: #e9b5c2;
      --rest-glow: #fff0d7;
    }

    .header-actions { display: flex; align-items: center; gap: 7px; }
    .theme-control {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex: 0 0 auto;
      white-space: nowrap;
      padding: 0 1px;
      font-size: 11px;
      font-weight: 800;
      color: var(--action);
    }
    .palette-icon {
      position: relative;
      display: block;
      width: 13px;
      height: 13px;
      border: 1px solid var(--action);
      border-radius: 4px;
      overflow: hidden;
      transform: rotate(-10deg);
    }
    .palette-icon i { position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--hero-tint); }
    .palette-icon i:nth-child(2) { left: 4px; background: var(--indicator); }
    .palette-icon i:nth-child(3) { left: 8px; background: var(--action); }
    .theme-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
    .theme-choice { min-height: 74px; border: 1px solid var(--line); border-radius: 11px; overflow: hidden; text-align: left; background: var(--white); }
    .theme-choice[aria-pressed="true"] { border-color: var(--action); box-shadow: inset 0 0 0 1px var(--action); }
    .theme-swatches { margin: 5px 5px 0; border-radius: 6px; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr 1fr; height: 30px; }
    .theme-name { display: flex; justify-content: space-between; gap: 5px; align-items: center; padding: 5px 9px 7px; font-size: 13px; }
    .theme-check { color: var(--action); font-weight: 800; }
    .sheet[data-kind="theme"]::backdrop { background: color-mix(in srgb, var(--ink) 28%, transparent); }

    @media (max-width: 355px) {
      .header-actions { gap: 5px; }
      .header-main .clock-pill { padding: 4px 5px; }
      .header-main > strong { max-width: 98px; }
    }

    :root {
      --sans: "Manrope", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
      font: 15px/1.5 var(--sans);
      font-synthesis: none;
      -webkit-text-size-adjust: 100%;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body, h1, h2, h3, h4, p, figure { margin: 0; }
    button, input { font: inherit; }
    button {
      border: 0;
      color: inherit;
      background: none;
      cursor: pointer;
      padding: 0;
      touch-action: manipulation;
    }
    button, a, input { -webkit-tap-highlight-color: transparent; }
    button, a { -webkit-user-select: none; user-select: none; }
    button:disabled { opacity: .42; cursor: default; }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 3px; }
    img { display: block; max-width: 100%; object-fit: contain; }
    [hidden] { display: none !important; }
    a { color: inherit; }

    body {
      display: grid;
      grid-template-columns: clamp(280px, 26vw, 390px) minmax(0, 1fr);
      min-height: 100svh;
      color: var(--ink);
      background: var(--rail);
    }
    .preview-rail {

    const escape = (value) => String(value ?? "").replace(/[&<>"']/g, (char) =>
      ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"})[char]);
    const clean = (value) => Number(Number(value).toFixed(2));
    const rawNumber = (value) => value === null ? "—" : String(clean(value));
    const pad = (value) => String(value).padStart(2, "0");
    const secondsSince = (start, end = Date.now()) => Math.max(0, Math.floor((end - start) / 1000));
    const clockSeconds = (seconds) => {
      const hours = Math.floor(seconds / 3600);
      const mmss = `${pad(Math.floor(seconds / 60) % 60)}:${pad(seconds % 60)}`;
      return hours ? `${hours}:${mmss}` : mmss;
    };
    const clock = (milliseconds) => clockSeconds(Math.max(0, Math.ceil(milliseconds / 1000)));

    let serial = 0;
    let modal = null;
    let toastTimer;
    let slideGesture = null;
    let interruptedSlideClick = null;
    let state = null;
    let planFilter = "全部";
    let libraryQuery = "";
    let libraryFilter = "全部";
    let detailTab = "overview";
    let chosenDay = "";
    let openPlanRow = "";
    let openRecapRow = "";
    const scrollPositions = new Map();

    function monthDay(timestamp) { return dateFormat.format(timestamp); }
    function dayStamp(timestamp) {
      const date = new Date(timestamp);
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    }

    function atDateOffset(offset, base = Date.now()) {
      const date = new Date(base);
      date.setDate(date.getDate() + offset);
      return date.getTime();
    }

    function seedSet(preset, values = {}) {
      return {
        id:`set-${++serial}`, weight:preset.weight, reps:preset.reps,
        previousWeight:null, previousReps:null,
        kind:"working", done:false, plannedRest:null, actualRest:null, ...values
      };
    }

    function makeExercise(code, rows) {
      const preset = catalog[code];
      const sets = rows
        ? rows.map(([weight, reps, kind = "working"]) => seedSet(preset, {weight, reps, kind}))
        : Array.from({length:3}, () => seedSet(preset));
      return {id:`exercise-${++serial}`, code, ...preset, sets};
    }

    function makeSession(planId, startedAt = Date.now()) {
      const plan = plans[planId];
      const exercises = plan?.entries.map(({code, rows}) => makeExercise(code, rows)) ?? [];
      return {
        id:`workout-${++serial}`, planId, name:plan?.name ?? "自由训练",
        exercises, activeId:exercises[0]?.id, selectedSet:null,
        startedAt, endedAt:null, rest:null, restFolded:false
      };
    }

    function sampleRecord(id, planId, days, time, adjustment) {
      const workout = makeSession(planId, atDateOffset(-days));
      workout.id = id;
      workout.endedAt = workout.startedAt + time * 1000;
      for (const exercise of workout.exercises) {
        exercise.sets.forEach((set, i) => {
          set.done = true;
          set.actualRest = 52 + i * 9;
          if (exercise.code === "BB_BENCH_PRESS") set.weight -= adjustment;
        });
      }
      return workout;
    }

    function sampleHistory() {
      return [
        sampleRecord("sample-pull", "pull", 1, 37 * 60 + 12, 0),
        sampleRecord("sample-push", "push", 2, 43 * 60 + 16, 2.5),
        sampleRecord("sample-legs", "legs", 4, 47 * 60 + 8, 0),
        sampleRecord("sample-push2", "push", 6, 41 * 60 + 22, 5),
        sampleRecord("sample-push3", "push", 9, 38 * 60 + 46, 7.5)
      ];
    }

    let records = sampleHistory();
    let latestClosed = null;

    function fillPrevious(workout) {
      for (const exercise of workout.exercises) {
        const history = historyFor(exercise.code)[0]?.sets ?? [];
        for (const kind of ["warmup", "working"]) {
          const same = history.filter(set => set.kind === kind);
          exercise.sets.filter(set => set.kind === kind).forEach((set, index) => {
            const previous = same[index];
            set.previousWeight = previous?.weight ?? null;
            set.previousReps = previous?.reps ?? null;
          });
        }
      }
    }

    function previewSession() {
      const workout = makeSession("push", Date.now() - 744_000);
      fillPrevious(workout);
      workout.exercises[0].sets.slice(0, 2).forEach((set, index) => {
        set.done = true;
        set.actualRest = index ? 84 : 44;
      });
      return workout;
    }

    const completed = (exercise) => exercise.sets.filter(set => set.done).length;
    const ordinal = (exercise) => state.exercises.indexOf(exercise) + 1;
    const setCeiling = (exercise) => exercise.sets.filter(set => set.kind !== "warmup").length;
    const setNumber = (exercise, set) =>
      exercise.sets.slice(0, exercise.sets.indexOf(set) + 1).filter(item => item.kind !== "warmup").length;
    const setLabel = (exercise, set) => set.kind === "warmup" ? "热身组" : `第 ${setNumber(exercise, set)} 组`;
    const previous = (set) => set.previousWeight === null ? "—" : `${rawNumber(set.previousWeight)} kg × ${rawNumber(set.previousReps)}`;
    const values = (set, gear) => gear === "自重" && set.weight === 0 && set.reps > 0 ? `自重 × ${set.reps}` : `${rawNumber(set.weight)} kg × ${rawNumber(set.reps)}`;
    const fieldLabel = (field) => field === "weight" ? "重量" : "次数";
    const currentExercise = () => state.exercises.find(item => item.id === state.activeId);
    const slots = () => state.exercises.flatMap(exercise => exercise.sets.map(set => ({exercise, set})));
    const lookup = (id) => slots().find(({set}) => set.id === id);
    const findExercise = (id) => state.exercises.find(exercise => exercise.id === id);
    const planGroupCount = (plan) => plan.entries.reduce((sum, item) => sum + item.rows.filter(([, , kind]) => !kind).length, 0);
    const exerciseTone = (exercise) => exercise.category === "腿" ? "rose" : exercise.category === "背" ? "blue" : "lilac";

    function workoutStats(workout) {
      const all = workout.exercises.flatMap(exercise => exercise.sets);
      const recorded = all.filter(set => set.done);
      const working = recorded.filter(set => set.kind !== "warmup");
      return {
        total:all.length, done:recorded.length, working:working.length,
        loggedExercises:workout.exercises.filter(exercise => completed(exercise) > 0).length,
        reps:working.reduce((sum, set) => sum + set.reps, 0),
        volume:working.reduce((sum, set) => sum + set.weight * set.reps, 0)
      };
    }
    const stats = () => workoutStats(state);

    function historyFor(code) {
      return records.flatMap(workout => {
        const sets = workout.exercises.filter(exercise => exercise.code === code).flatMap(exercise => exercise.sets.filter(set => set.done));
        return sets.some(set => set.kind !== "warmup") ? [{workout, sets}] : [];
      });
    }

    function nextPlanId() {
      const sequence = ["push", "legs", "pull"];
      const last = records.find(workout => workout.planId);
      return sequence[(sequence.indexOf(last?.planId) + 1) % sequence.length];
    }

    function normalizeRoute(page, item) {
      if (!Object.hasOwn(pageNames, page)) page = "home";
      if (page === "plan") return {page, item:Object.hasOwn(plans, item) ? item : "push"};
      if (page === "exercise") return {page, item:Object.hasOwn(catalog, item) ? item : "BB_BENCH_PRESS"};
      if (page === "recap") return {page, item:records.find(workout => workout.id === item)?.id ?? records[0].id};
      return {page, item:""};
    }

    function readRoute() {
      const query = new URLSearchParams(location.search);
      return normalizeRoute(query.get("page") || "home", query.get("item"));
    }

    function routeKey(value) { return `${value.page}/${value.item}`; }
    let route = readRoute();
    if (route.page === "workout") state = previewSession();
    history.replaceState({guidedDemo:true, depth:0}, "", location.href);

    function changeRoute(page, item = "", {replace = false, animate = true} = {}) {
      if (modal) closeSheet();
      const target = normalizeRoute(page, item);
      if (target.page === "workout" && !state) state = previewSession();
      if (routeKey(route) === routeKey(target)) {
        render({animate:false});
        return;
      }
      scrollPositions.set(routeKey(route), viewport.scrollTop);
      if (target.page === "exercise") detailTab = "overview";
      if (target.page === "recap") openRecapRow = "";
      const url = new URL(location.href);
      url.searchParams.set("page", target.page);
      if (target.item) url.searchParams.set("item", target.item);
      else url.searchParams.delete("item");
      history[replace ? "replaceState" : "pushState"]({
        guidedDemo:true,
        depth:(history.state?.depth ?? 0) + (replace ? 0 : 1)
      }, "", url);
      route = target;
      render({scrollTop:0, animate});
    }

    function goBack() {
      if (history.state?.depth > 0) history.back();
      else changeRoute(route.page === "plan" ? "plans" : route.page === "exercise" ? "library" : "home", "", {replace:true});
    }

    function beginWorkout(planId) {
      if (state) {
        if (state.planId === planId) changeRoute("workout");
        else showSheet("conflict", {planId});
      } else {
        startWorkout(planId);
      }
    }

    function startWorkout(planId) {
      state = makeSession(planId);
      fillPrevious(state);
      changeRoute("workout");
      if (!state.exercises.length) showSheet("library");
    }

    function recapSession() {
      closeSheet();
      storeRest();
      const workout = state;
      state = null;
      if (!workoutStats(workout).done) {
        changeRoute("home", "", {replace:true});
        notify("已结束训练");
        return;
      }
      workout.endedAt = Date.now();
      workout.exercises = workout.exercises.filter(exercise => completed(exercise)).map(exercise =>
        ({...exercise, sets:exercise.sets.filter(set => set.done)}));
      records.unshift(workout);
      latestClosed = workout.id;
      chosenDay = "";
      changeRoute("recap", workout.id, {replace:true});
    }

    function resetSession() {
      closeSheet();
      state = null;
      records = sampleHistory();
      latestClosed = null;
      chosenDay = "";
      libraryQuery = "";
      libraryFilter = "全部";
      planFilter = "全部";
      openPlanRow = "";
      openRecapRow = "";
      scrollPositions.clear();
      changeRoute("home", "", {replace:true});
      notify("已恢复示例");
    }

    function button(content, action, attrs = "") {
      return `<button type="button" data-action="${action}" ${attrs}>${content}</button>`;
    }

    function artwork(exercise, alt = "") {
      return `<img src="${exerciseImages[exercise.code]}" width="288" height="288" alt="${escape(alt)}" draggable="false">`;
    }

    function linkPage(content, page, item = "", attrs = "") {
      return button(content, "go", `data-page="${page}" data-id="${item}" ${attrs}`);
    }

    function renderPreviewNav() {
      nav.innerHTML = Object.entries(pageNames).map(([page, name], index) => button(
        `<span class="nav-index" aria-hidden="true">${pad(index + 1)}</span><span>${name}</span>${chevron()}`,
        "preview", `data-page="${page}" data-control="preview-${page}" ${route.page === page ? 'aria-current="page"' : ""}`
      )).join("");
    }

    function renderHeader() {
      if (route.page === "workout") {
        return `<div class="header-main">
          ${button(chevron(), "minimize", 'class="back-link minimize-link" aria-label="收起训练" data-control="minimize"')}
          <strong>${state.name}</strong><span class="clock-pill" role="timer" aria-label="训练时长">
            <i class="live-dot" aria-hidden="true"></i><span data-session-clock>${sessionClock()}</span>
          </span>
        </div><div class="header-actions">${themeControl()}${button("结束训练", "finish", 'class="finish-link" data-control="finish"')}</div>`;
      }
      if (rootPages.includes(route.page)) {
        return `<span class="app-brand"><span class="brand-mark" aria-hidden="true"><i></i></span><b>别练了</b></span>
          <div class="header-actions">${route.page === "home" ? button("自由训练", "begin", 'class="preview-link" data-control="free"') : ""}${themeControl()}</div>`;
      }
      return `${button(`${chevron()} 返回`, "back", 'class="back-link" data-control="back"')}
        <strong class="nav-label">${pageNames[route.page]}</strong>${themeControl()}`;
    }

    function tabBar() {
      return `<nav class="tab-strip" aria-label="主要页面">
        ${[["home","训练"],["plans","计划"],["library","动作库"]].map(([page,name]) =>
          linkPage(`<span class="tab-sigil ${page}" aria-hidden="true"></span>${name}`, page, "",
            `data-control="tab-${page}" ${route.page === page ? 'aria-current="page"' : ""}`)).join("")}
      </nav>`;
    }

    function weekData() {
      const today = new Date();
      const monday = atDateOffset(-((today.getDay() + 6) % 7), today);
      const mondayKey = dayStamp(monday);
      const nextKey = dayStamp(atDateOffset(7, monday));
      const thisWeek = records.filter(workout => {
        const day = dayStamp(workout.startedAt);
        return day >= mondayKey && day < nextKey;
      });
      const doneDays = new Set(thisWeek.map(item => dayStamp(item.startedAt)));
      const weekly = thisWeek.reduce((total, workout) => {
        const data = workoutStats(workout);
        return {volume:total.volume + data.volume, groups:total.groups + data.working, reps:total.reps + data.reps};
      }, {volume:0, groups:0, reps:0});
      return {today, monday, thisWeek, doneDays, weekly};
    }

    function homeResume() {
      if (!state) return "";
      const data = stats();
      return linkPage(`<span class="resume-icon" aria-hidden="true">▷</span>
        <span><strong>继续训练</strong><small>${state.name} <span aria-hidden="true">/</span> ${data.done}/${data.total} 组</small></span>
        <span class="count" ${state.rest ? "data-rest-clock" : "data-session-clock"}></span>${chevron()}`,
        "workout", "", 'class="home-resume" data-control="resume"');
    }

    function renderHome() {
      const {today, monday, thisWeek, doneDays, weekly} = weekData();
      const completeToday = doneDays.has(dayStamp(today));
      const weekdayLetters = ["一","二","三","四","五","六","日"];
      const calendar = weekdayLetters.map((name, i) => {
        const day = atDateOffset(i, monday);
        const stamp = dayStamp(day);
        const selected = chosenDay === stamp;
        const done = doneDays.has(stamp);
        const isToday = stamp === dayStamp(today);
        return button(`<span>${name}</span><b aria-hidden="true">${done ? "✓" : new Date(day).getDate()}</b>`, "calendar-day",
          `class="day-chip ${done ? "done" : ""} ${isToday ? "today" : ""}" data-id="${stamp}" data-control="day-${stamp}"
          aria-pressed="${selected}" aria-label="${monthDay(day)}${isToday ? "，今天" : ""}${done ? "，有训练记录" : ""}"
          ${stamp > dayStamp(today) ? "disabled" : ""}`);
      }).join("");
      const nextId = nextPlanId();
      const next = plans[nextId];
      const recent = (chosenDay ? records.filter(item => dayStamp(item.startedAt) === chosenDay) : records).slice(0, 3);
      return `<article class="screen home-screen" data-screen="home">
        <div class="screen-head">
          <div><span class="eyebrow">${dayFormat.format(today)}</span><h2>训练</h2></div>
        </div>
        ${homeResume()}
        <section class="week-card" aria-label="本周训练">
          <div class="week-head">
            <div><p class="eyebrow">${completeToday ? "今天已训练" : "本周训练"}</p>
              <div class="week-number"><strong>${thisWeek.length}</strong><span>次训练</span></div>
            </div>
            <div class="week-totals"><b>${numberFormat.format(weekly.groups)} 组</b><span>${numberFormat.format(weekly.reps)} 次动作</span></div>
          </div>
          <div class="week-grid">${calendar}</div>
        </section>
        <section class="next-section">
          <div class="section-title"><h3>下次训练</h3>${linkPage("全部计划", "plans", "", 'class="inline-link" data-control="all-plans"')}</div>
          ${linkPage(`<div class="next-plan-text">
              <h4>${next.name}</h4><p>${next.entries.length} 个动作 <span aria-hidden="true">/</span> ${planGroupCount(next)} 个正式组</p>
              <span class="plan-chip">查看计划 ${chevron()}</span>
            </div>${artwork(next.entries[0])}`, "plan", nextId,
            `class="next-plan hero-surface tone-${next.tone}" data-control="next-plan"`)}
        </section>
        <section class="recent-section">
          <div class="section-title"><h3>${chosenDay ? "当天训练" : "最近训练"}</h3>
            ${chosenDay ? button("显示全部", "clear-day", 'class="inline-link" data-control="clear-day"') : ""}
          </div>
          ${recent.length ? recent.map(renderRecent).join("") : '<p class="empty-copy">这一天还没有训练记录。</p>'}
        </section>
      </article>`;
    }

    function renderRecent(workout) {
      const data = workoutStats(workout);
      const lead = workout.exercises[0];
      return linkPage(`<span class="recent-thumb">${lead ? artwork(lead) : checkIcon}</span>
        <span class="recent-label"><strong>${workout.name}</strong><small>${monthDay(workout.startedAt)} · ${data.working} 个正式组</small></span>
        <span class="count">${clockSeconds(secondsSince(workout.startedAt, workout.endedAt))}</span>${chevron()}`,
        "recap", workout.id, `class="recent-row" data-control="record-${workout.id}"`);
    }

    function filterButtons(values, selected, action) {
      return values.map(value => button(value, action, `class="filter-chip" data-id="${value}"
        data-control="${action}-${value}" aria-pressed="${value === selected}"`)).join("");
    }

    function renderPlans() {
      const filtered = Object.entries(plans).filter(([, plan]) => planFilter === "全部" || plan.zone === planFilter);
      return `<article class="screen plans-screen" data-screen="plans">
        <div class="screen-head"><h2>训练计划</h2><span class="minor">${filtered.length} 套</span></div>
        <div class="filter-strip" aria-label="按部位筛选计划">${filterButtons(["全部","上肢","下肢"],planFilter,"plan-filter")}</div>
        <div class="plan-covers">${filtered.map(([id, plan]) => linkPage(`<div class="cover-info">
            <span class="eyebrow">${plan.target}</span><h3>${plan.name}</h3>
            <p>${plan.entries.length} 个动作 <span aria-hidden="true">/</span> 约 ${plan.minutes} 分钟</p>
          </div>${artwork(plan.entries[0])}<span class="cover-arrow">${chevron()}</span>`,
          "plan", id, `class="plan-cover hero-surface tone-${plan.tone}" data-control="plan-card-${id}"`)).join("")}</div>
      </article>`;
    }

    function planRowSummary(rows) {
      const working = rows.filter(([, , kind]) => !kind);
      const repetitions = new Set(working.map(([, reps]) => reps));
      return repetitions.size === 1 ? `${working.length} 组 × ${working[0][1]} 次` : `${working.length} 组 · 次数不一`;
    }

    function renderPlanDetail() {
      const plan = plans[route.item];
      const arrangements = plan.entries.map((entry, index) => {
        const ex = catalog[entry.code];
        const expanded = openPlanRow === `${route.item}-${entry.code}`;
        const warmups = entry.rows.filter(([, , kind]) => kind === "warmup").length;
        return `<div class="plan-step ${expanded ? "expanded" : ""}">
          ${button(`<span class="plan-step-number" aria-hidden="true">${pad(index + 1)}</span>
            <span class="plan-step-thumb">${artwork(entry)}</span>
            <span class="plan-step-label"><strong>${ex.name}</strong><small>${planRowSummary(entry.rows)}</small></span>
            ${chevron(expanded ? "up" : "down")}`, "plan-row",
            `class="plan-step-button" data-id="${entry.code}" data-control="plan-step-${entry.code}" aria-expanded="${expanded}"`)}
          ${expanded ? `<div class="plan-arrangement">
            <div class="arrangement-head"><strong>组次安排</strong>
              ${linkPage("动作详情", "exercise", entry.code, `class="inline-link" data-control="plan-info-${entry.code}"`)}
            </div>
            ${entry.rows.map(([weight, reps, kind], rowIndex) => `<div class="arrangement-row">
               <span>${kind === "warmup" ? "热身组" : `第 ${rowIndex + 1 - warmups} 组`}</span>
               <b class="count">${values({weight,reps})}</b>
            </div>`).join("")}
          </div>` : ""}
        </div>`;
      });
      return `<article class="screen plan-screen" data-screen="plan">
        <div class="plan-hero hero-surface tone-${plan.tone}">
          <div class="plan-hero-text"><p class="eyebrow">${plan.zone}计划</p><h2>${plan.name}</h2><p>${plan.target}</p></div>
          ${artwork(plan.entries[0])}
          <div class="plan-metrics">
            <div><b>${plan.entries.length}</b><span>动作</span></div>
            <div><b>${planGroupCount(plan)}</b><span>正式组</span></div>
            <div><b>${plan.minutes}</b><span>预计分钟</span></div>
          </div>
        </div>
        <section class="plan-steps">
          <div class="section-title"><h3>训练顺序</h3></div>
          ${arrangements.join("")}
        </section>
      </article>`;
    }

    function libraryMatches(query, category = "全部") {
      const words = query.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);
      return Object.entries(catalog).filter(([, exercise]) =>
        (category === "全部" || exercise.category === category) &&
        words.every(word => `${exercise.name} ${exercise.muscle} ${exercise.gear} ${exercise.aliases.join(" ")}`.toLocaleLowerCase().includes(word))
      );
    }

    function libraryGrid(matches) {
      if (!matches.length) return `<div class="empty-copy">没有找到匹配动作。 ${button("清除筛选", "library-clear", 'class="inline-link" data-control="library-clear"')}</div>`;
      return matches.map(([code, exercise]) => linkPage(
        `<div class="exercise-card-media tone-${exerciseTone(exercise)}">${artwork({code})}</div>
          <div class="exercise-card-name"><span><strong>${exercise.name}</strong><small>${exercise.muscle} / ${exercise.gear}</small></span>${chevron()}</div>`,
        "exercise", code, `class="exercise-card" data-control="library-${code}"`
      )).join("");
    }

    function renderLibrary() {
      const matches = libraryMatches(libraryQuery, libraryFilter);
      return `<article class="screen library-screen" data-screen="library">
        <div class="screen-head"><h2>动作库</h2><span class="minor" data-library-count>${matches.length} 个动作</span></div>
        <label class="library-search"><span aria-hidden="true"></span><input id="library-search" type="search" autocomplete="off"
          placeholder="搜索动作名、部位或器械" aria-label="搜索动作名、部位或器械" value="${escape(libraryQuery)}"></label>
        <div class="filter-strip library-filters" aria-label="按部位筛选动作">
          ${filterButtons(["全部","胸","背","肩","腿","手臂"],libraryFilter,"library-filter")}
        </div>
        <div class="exercise-grid" id="exercise-grid">${libraryGrid(matches)}</div>
      </article>`;
    }

    function adjustLibrary() {
      const matches = libraryMatches(libraryQuery, libraryFilter);
      viewport.querySelector("#exercise-grid").innerHTML = libraryGrid(matches);
      viewport.querySelector("[data-library-count]").textContent = `${matches.length} 个动作`;
    }

    function regionList(codes) { return codes.map(code => regions[code]).filter(Boolean); }

    function exerciseOverview(exercise) {
      const primary = regionList(exercise.primary);
      const secondary = regionList(exercise.secondary);
      return `<section class="muscle-card">
        <div class="section-title"><h3>目标肌群</h3></div>
        <div class="muscle-row"><i class="muscle-dot primary-muscle" aria-hidden="true"></i>
          <div><span>主要发力</span><b>${primary.join("、")}</b></div>
        </div>
        ${secondary.length ? `<div class="muscle-row"><i class="muscle-dot" aria-hidden="true"></i>
          <div><span>协同发力</span><b>${secondary.join("、")}</b></div>
        </div>` : ""}
        ${exercise.cues.length ? `<div class="form-cues"><h4>动作要点</h4><ol>${exercise.cues.map(cue => `<li>${escape(cue)}</li>`).join("")}</ol></div>` : ""}
      </section>`;
    }

    function exerciseRecords(code) {
      const matches = historyFor(code);
      const gear = catalog[code].gear;
      if (!matches.length) {
        return '<section class="muscle-card"><h3>还没练过</h3><p class="empty-copy">完成这个动作后，重量和次数会出现在这里。</p></section>';
      }
      const peaks = matches.map(({workout, sets}) => {
        const working = sets.filter(set => set.kind !== "warmup");
        const peak = working.reduce((best, set) => (set.weight > best.weight ? set : best), working[0]);
        return {workout, peak, last:working.at(-1)};
      });
      const max = Math.max(...peaks.map(({peak}) => peak.weight));
      return `<section class="exercise-history">
        <div class="exercise-metrics">
          <div><span>最近一组</span><b>${values(peaks[0].last, gear)}</b><small>${monthDay(peaks[0].workout.startedAt)}</small></div>
          <div><span>最高重量</span><b>${max ? `${rawNumber(max)} kg` : "自重"} </b><small>已完成的正式组</small></div>
        </div>
        ${max > 0 && peaks.length > 1 ? `<div class="exercise-trend">
          <div class="section-title"><h3>每次最高重量</h3><span class="minor">kg</span></div>
          <div class="trend-bars">
            ${peaks.slice(0,5).reverse().map(({workout, peak}) => linkPage(
              `<b class="count">${rawNumber(peak.weight)}</b><span class="trend-scale"><i style="--bar:${peak.weight / max * 100}%"></i></span><small>${monthDay(workout.startedAt)}</small>`,
              "recap", workout.id, `class="trend-bar" aria-label="${monthDay(workout.startedAt)}，${values(peak, gear)}，查看训练记录"`
            )).join("")}
          </div>
        </div>` : ""}
        <div class="section-title"><h3>最近记录</h3></div>
        ${peaks.slice(0,3).map(({workout, peak}) => linkPage(`<span><strong>${monthDay(workout.startedAt)}</strong><small>${workout.name}</small></span>
            <b class="count">${values(peak, gear)}</b>${chevron()}`, "recap", workout.id,
            `class="exercise-record-row" data-control="exercise-record-${workout.id}"`)).join("")}
      </section>`;
    }

    function renderExerciseDetail() {
      const exercise = catalog[route.item];
      return `<article class="screen detail-screen" data-screen="exercise">
        <figure class="detail-hero hero-surface tone-${exerciseTone(exercise)}">
          <figcaption><p class="eyebrow">${exercise.muscle} / ${exercise.gear}</p><h2>${exercise.name}</h2></figcaption>
          ${artwork({code:route.item}, `${exercise.name}示意图`)}
        </figure>
        <div class="detail-tabs" role="group" aria-label="动作详情内容">
          ${button("动作说明", "detail-tab", `data-id="overview" data-control="detail-overview" aria-pressed="${detailTab === "overview"}"`)}
          ${button("训练记录", "detail-tab", `data-id="records" data-control="detail-records" aria-pressed="${detailTab === "records"}"`)}
        </div>
        ${detailTab === "overview" ? exerciseOverview(exercise) : exerciseRecords(route.item)}
      </article>`;
    }

    function renderRecap() {
      const workout = records.find(record => record.id === route.item);
      const data = workoutStats(workout);
      const mark = workout.id === latestClosed;
      return `<article class="screen recap-screen" data-screen="recap">
        <div class="result-hero">
          <div class="result-title"><span class="eyebrow">${monthDay(workout.startedAt)}的训练</span>
            <h2>${mark ? "训练完成" : workout.name}</h2>
            ${mark ? `<p>${workout.name}</p>` : `<p>${data.loggedExercises} 个动作已记录</p>`}
          </div><span class="result-check" aria-hidden="true">✓</span>
          <div class="result-metrics">
            <div><b class="count">${clockSeconds(secondsSince(workout.startedAt, workout.endedAt))}</b><span>训练时长</span></div>
            <div><b class="count">${data.working}</b><span>正式组</span></div>
            <div><b class="count">${numberFormat.format(data.volume)}</b><span>训练量 kg</span></div>
          </div>
        </div>
        <section class="recap-rows">
          <div class="section-title"><h3>完成的动作</h3><span class="minor">${data.loggedExercises} 个</span></div>
          ${workout.exercises.map(exercise => {
            const expanded = openRecapRow === exercise.id;
            const warm = exercise.sets.filter(set => set.kind === "warmup").length;
            return `<div class="recap-exercise">
              ${button(`<span class="recent-thumb">${artwork(exercise)}</span>
                <span><strong>${exercise.name}</strong><small>${exercise.sets.length - warm} 正式组${warm ? ` / ${warm} 热身组` : ""}</small></span>${chevron(expanded ? "up" : "down")}`,
                "recap-row", `class="recap-exercise-button" data-id="${exercise.id}" data-control="recap-${exercise.id}" aria-expanded="${expanded}"`)}
              ${expanded ? `<div class="recap-setlist">
                ${exercise.sets.map(set => `<div class="recap-set"><span>${setLabel(exercise,set)}</span>
                  <b class="count">${values(set, exercise.gear)}</b>${set.actualRest == null ? "<span></span>" : `<small>休 ${clockSeconds(set.actualRest)}</small>`}</div>`).join("")}
              </div>` : ""}
            </div>`;
          }).join("")}
        </section>
        ${workout.planId ? linkPage(`查看${workout.name}计划 ${chevron()}`, "plan", workout.planId, 'class="inline-link recap-plan" data-control="recap-plan"') : ""}
      </article>`;
    }

    function resumeMini() {
      if (!state) return "";
      return linkPage(`<i class="live-dot" aria-hidden="true"></i><strong>继续训练 · ${state.name}</strong>
          <span class="count" ${state.rest ? "data-rest-clock" : "data-session-clock"}></span>${chevron()}`,
        "workout", "", 'class="resume-mini" data-control="resume-mini"');
    }

    function renderAppDock() {
      if (route.page === "workout") return renderWorkDock();
      if (rootPages.includes(route.page)) return `${route.page === "home" ? "" : resumeMini()}${tabBar()}`;
      if (route.page === "plan") {
        return `${state && state.planId !== route.item ? resumeMini() : ""}
          ${button(state?.planId === route.item ? "继续训练" : "开始计划训练", "begin",
            `class="primary" data-id="${route.item}" data-control="start-plan"`)}`;
      }
      if (route.page === "recap") return linkPage("回到训练首页", "home", "", 'class="primary" data-control="return-home"');
      return resumeMini();
    }

    function render({scrollTop = null, animate = false} = {}) {
      const control = document.activeElement?.dataset.control;
      const previousScroll = viewport.scrollTop;
      device.dataset.page = route.page;
      renderPreviewNav();
      header.innerHTML = renderHeader();
      const screens = {
        home:renderHome, plans:renderPlans, plan:renderPlanDetail, library:renderLibrary,
        exercise:renderExerciseDetail, workout:renderFocus, recap:renderRecap
      };
      viewport.innerHTML = screens[route.page]();
      dock.innerHTML = renderAppDock();
      viewport.scrollTop = scrollTop ?? previousScroll;
      updateClocks();
      if (control && !sheet.open) {
        const target = document.querySelector(`[data-control="${CSS.escape(control)}"]:not(:disabled)`);
        const phaseControl = ["primary-set", "end-rest", "show-rest", "hide-rest"].includes(control);
        const replacement = phaseControl ? dock.querySelector(".primary, .slide-complete") : null;
        (target ?? replacement)?.focus({preventScroll:true});
      }
      if (animate && !reducedMotion.matches) {
        const element = viewport.querySelector("[data-phase-view], [data-screen]");
        element?.animate([{opacity:.72, transform:"translateY(4px)"},{opacity:1, transform:"none"}],
          {duration:220, easing:"cubic-bezier(.22,.68,.2,1)"});
      }
    }

    function currentSlot() {
      const exercise = currentExercise();
      const set = exercise.sets.find(item => item.id === state.selectedSet) ??
        exercise.sets.find(item => !item.done) ?? exercise.sets.at(-1);
      return {exercise, set};
    }

    function nextUnfinished(afterId) {
      const entries = slots();
      const at = entries.findIndex(({set}) => set.id === afterId);
      return entries.slice(at + 1).find(({set}) => !set.done) ?? entries.find(({set}) => !set.done);
    }

    function setSelection(exercise, set = null) {
      state.activeId = exercise.id;
      state.selectedSet = set?.id ?? null;
    }

    function stepSet(offset) {
      const {exercise, set} = currentSlot();
      const next = exercise.sets[exercise.sets.indexOf(set) + offset];
      if (!next) return;
      setSelection(exercise, next);
      render({animate:true});
    }

    function addSet(exercise, focus = false) {
      const last = exercise.sets.at(-1);
      const set = seedSet(exercise, {
        weight: last?.weight ?? exercise.weight, reps: last?.reps ?? exercise.reps,
        previousWeight: null, previousReps: null
      });
      exercise.sets.push(set);
      setSelection(exercise, set);
      if (state.rest) state.restFolded = true;
      render();
      if (focus) {
        openKeypad(set.id, "weight");
      } else {
        keepVisible(`[data-row="${set.id}"]`);
        notify("已加一组");
      }
    }

    function restRemaining() {
      return state.rest ? Math.max(0, state.rest.endsAt - Date.now()) : 0;
    }

    function restPercent() {
      return state.rest ? Math.max(0, Math.min(100, restRemaining() / (state.rest.target * 10))) : 0;
    }

    function storeRest() {
      if (!state.rest) return;
      const rest = state.rest;
      const slot = lookup(rest.setId);
      if (slot?.set.done) {
        slot.set.plannedRest = rest.target;
        slot.set.actualRest = secondsSince(rest.startedAt, Math.min(Date.now(), rest.endsAt));
      }
      state.rest = null;
      state.restFolded = false;
    }

    function adjustRest(change) {
      if (!state.rest) return;
      const rest = state.rest;
      rest.target = Math.max(10, Math.min(900, rest.target + change));
      rest.endsAt = rest.startedAt + rest.target * 1000;
      if (!restRemaining()) endRest();
      else updateClocks();
    }

    function toggleSet(id) {
      const slot = lookup(id);
      if (!slot) return;
      const {exercise, set} = slot;
      if (set.done) {
        if (state.rest?.setId === set.id) storeRest();
        set.done = false;
        set.plannedRest = null;
        set.actualRest = null;
        setSelection(exercise, set);
        render();
        notify(`已撤销${setLabel(exercise, set)}`);
        return;
      }
      if (set.weight === null || !(set.reps > 0)) {
        openKeypad(set.id, set.weight === null ? "weight" : "reps");
        return;
      }
      storeRest();
      set.done = true;
      const next = nextUnfinished(set.id);
      const preceding = exercise.sets[exercise.sets.indexOf(set) - 1];
      const inheritsRest = !exercise.restOverride && preceding?.kind === "working";
      const target = inheritsRest ? preceding.plannedRest ?? exercise.rest : exercise.rest;
      exercise.restOverride = false;
      if (next && target > 0) {
        const now = Date.now();
        state.rest = {setId: set.id, startedAt: now, target, endsAt: now + target * 1000};
        set.plannedRest = target;
      }
      setSelection(next?.exercise ?? exercise, next?.set ?? set);
      render({animate:true});
      if (!next) notify("所有组已完成");
      else if (!state.rest) notify(`已记录${setLabel(exercise, set)}`);
    }

    function sessionClock() {
      return clockSeconds(secondsSince(state.startedAt));
    }

    function notify(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("visible");
      toastTimer = setTimeout(() => {
        toast.classList.remove("visible");
        toast.textContent = "";
      }, 1850);
    }

    function keepVisible(selector) {
      const target = viewport.querySelector(selector);
      if (!target) return;
      const bounds = viewport.getBoundingClientRect();
      const area = target.getBoundingClientRect();
      if (area.top < bounds.top || area.bottom > bounds.bottom) {
        target.scrollIntoView({block:"nearest", behavior:reducedMotion.matches ? "instant" : "smooth"});
      }
    }

    const restAdjust = () => [-10, 10].map(delta => button(
      `${delta < 0 ? "−" : "+"}10 秒`, "adjust-rest",
      `class="sub-button" data-delta="${delta}" data-control="rest-${delta}" aria-label="${delta < 0 ? "减少" : "增加"} 10 秒休息"`
    )).join("");

    function renderFocus() {
      if (!state.exercises.length) {
        return `<article class="screen empty-workout" data-screen="workout">
          <h2>自由训练</h2><p class="empty-copy">先添加一个动作，再开始记录组次。</p>
        </article>`;
      }
      const {exercise, set} = currentSlot();
      const showRest = state.rest && !state.restFolded;
      const steps = state.exercises.map(item => button("<span aria-hidden='true'></span>", "select-exercise",
        `data-id="${item.id}" data-control="focus-${item.id}" aria-label="切换到${item.name}"
          ${completed(item) === item.sets.length ? 'class="is-done"' : ""}
          ${item.id === exercise.id ? 'aria-current="step"' : ""}`
      )).join("");
      return `<article class="focus-layout">
        <div class="focus-progress">
          <span>动作 ${pad(ordinal(exercise))} / ${pad(state.exercises.length)}</span>
          <div>${steps}</div>
        </div>
        ${showRest ? renderFocusRest() : renderFocusSet(exercise, set)}
      </article>`;
    }

    function renderFocusSet(exercise, set) {
      const currentIndex = exercise.sets.indexOf(set);
      const upcoming = state.exercises[ordinal(exercise)];
      const fields = ["weight", "reps"].map(field => {
        const value = rawNumber(set[field]);
        return button(`<span>${fieldLabel(field)}</span><strong>${value}</strong><small>${field === "weight" ? "kg" : "次"}</small>`,
          "edit", `class="focus-value" data-id="${set.id}" data-field="${field}"
            data-control="edit-${set.id}-${field}" aria-label="编辑${setLabel(exercise, set)}${fieldLabel(field)}，${value}"`);
      }).join("");
      return `<figure class="focus-hero" data-phase-view>
        <div class="focus-hero-head"><p>${exercise.muscle} / ${exercise.gear}</p><h2>${exercise.name}</h2></div>
        ${artwork(exercise)}
        ${linkPage("动作示意", "exercise", exercise.code, `class="focus-art-button" data-control="detail-${exercise.id}"`)}
      </figure>
      <div class="focus-stepper" data-row="${set.id}">
        ${button(chevron(), "step-set", `data-delta="-1" data-control="prev-set" aria-label="上一组" ${currentIndex === 0 ? "disabled" : ""}`)}
        <div><strong>${setLabel(exercise, set)}${set.done ? " ✓" : ""}</strong><small class="minor">${set.done ? "已记录，" : ""}共 ${setCeiling(exercise)} 个正式组</small></div>
        ${button(chevron(), "step-set", `data-delta="1" data-control="next-set" aria-label="下一组"
          ${currentIndex === exercise.sets.length - 1 ? "disabled" : ""}`)}
      </div>
      <div class="focus-values">${fields}</div>
      <div class="focus-history">
        <span class="minor">上次${setLabel(exercise, set)} <b>${previous(set)}</b></span>
        ${button("＋ 加一组", "add-set", `class="inline-link" data-id="${exercise.id}" data-control="add-set-${exercise.id}"`)}
      </div>
      ${upcoming ? button(`${artwork(upcoming)}<span><small class="minor">下个动作</small>
        <strong>${upcoming.name}</strong></span>${chevron()}`, "select-exercise",
        `class="focus-next focus-upcoming" data-id="${upcoming.id}" data-control="next-exercise"`) : ""}`;
    }

    function renderFocusRest() {
      const next = nextUnfinished(state.rest.setId);
      return `<div class="focus-hero focus-rest-hero" data-phase-view>
          <div class="focus-hero-head"><p>组间休息</p></div>
          <div class="focus-orbit" data-rest-progress>
            <div><strong data-rest-clock aria-label="休息剩余"></strong><small>剩余时间</small></div>
          </div>
        </div>
        <div class="focus-rest-adjust rest-adjust">${restAdjust()}</div>
        <div class="focus-next">
          ${artwork(next.exercise)}
          <div><span class="minor">接下来</span><strong>${next.exercise.name} ${setLabel(next.exercise, next.set)}</strong></div>
          <span class="count">${values(next.set, next.exercise.gear)}</span>
        </div>
        ${button("查看组次", "hide-rest", 'class="inline-link" data-control="hide-rest"')}`;
    }

    // 短滑返回原位，越过阈值才通过滑动完成。点按和键盘共用普通按钮路径。
    dock.addEventListener("pointerdown", (event) => {
      const button = event.target.closest(".slide-complete");
      if (!button || !event.isPrimary || event.button !== 0) return;
      interruptedSlideClick = null;
      const travel = Math.max(1, button.clientWidth - 53);
      slideGesture = {button, start:event.clientX, pointerId:event.pointerId, travel, moved:false};
      button.setPointerCapture(event.pointerId);
    });

    dock.addEventListener("pointermove", (event) => {
      const gesture = slideGesture;
      if (!gesture || gesture.pointerId !== event.pointerId) return;
      const delta = event.clientX - gesture.start;
      if (Math.abs(delta) > 6) gesture.moved = true;
      if (!gesture.moved) return;
      const offset = Math.max(0, Math.min(gesture.travel, delta));
      gesture.button.classList.add("dragging");
      gesture.button.style.setProperty("--drag", `${offset}px`);
      gesture.button.style.setProperty("--slide-fill", `${(offset + 24) / (gesture.travel + 53) * 100}%`);
    });

    function finishSlide(event) {
      const gesture = slideGesture;
      if (!gesture || gesture.pointerId !== event.pointerId) return;
      slideGesture = null;
      gesture.button.classList.remove("dragging");
      gesture.button.style.removeProperty("--drag");
      gesture.button.style.removeProperty("--slide-fill");
      if (!gesture.moved) return;
      interruptedSlideClick = gesture.button;
      if (event.type === "pointerup" && event.clientX - gesture.start >= gesture.travel * .72) {
        toggleSet(gesture.button.dataset.id);
      }
    }

    dock.addEventListener("pointerup", finishSlide);
    dock.addEventListener("pointercancel", finishSlide);
    dock.addEventListener("lostpointercapture", finishSlide);

    function changeExercise(exercise) {
      setSelection(exercise);
      if (state.rest) state.restFolded = true;
      render({scrollTop:0, animate:true});
    }

    function addExercise(code) {
      const exercise = makeExercise(code);
      fillPrevious({exercises:[exercise]});
      state.exercises.push(exercise);
      closeSheet();
      changeExercise(exercise);
      notify(`已添加${exercise.name}`);
    }

    function revealRest() {
      if (!state.rest) return;
      state.restFolded = false;
      render({scrollTop:0, animate:true});
    }

    function endRest() {
      if (!state?.rest) return;
      const expanded = !state.restFolded;
      const next = expanded ? nextUnfinished(state.rest.setId) : null;
      storeRest();
      if (next) setSelection(next.exercise, next.set);
      if (route.page === "workout") {
        render({animate:expanded});
      } else {
        for (const element of device.querySelectorAll("[data-rest-clock]")) {
          element.removeAttribute("data-rest-clock");
          element.setAttribute("data-session-clock", "");
        }
        updateClocks();
      }
      notify("休息结束");
    }

    function updateClocks() {
      if (!state) return;
      const elapsed = sessionClock();
      for (const label of device.querySelectorAll("[data-session-clock]")) {
        if (label.textContent !== elapsed) label.textContent = elapsed;
      }
      if (!state.rest) return;
      const remaining = clock(restRemaining());
      for (const timer of device.querySelectorAll("[data-rest-clock]")) {
        if (timer.textContent !== remaining) timer.textContent = remaining;
      }
      const progress = `${restPercent()}%`;
      for (const meter of device.querySelectorAll("[data-rest-progress]")) {
        meter.style.setProperty("--progress", progress);
      }
    }

    function renderWorkDock() {
      if (!state.exercises.length) {
        return button("＋ 添加动作", "add-exercise", 'class="primary" data-control="add-exercise"');
      }
      const rest = state.rest;
      const showRest = rest && !state.restFolded;
      const {exercise, set} = currentSlot();
      const label = setLabel(exercise, set);
      const queue = button(`${listIcon} 动作`, "queue", 'class="secondary dock-list" data-control="queue" aria-label="查看训练动作列表"');
      const timer = rest && !showRest ? button('<span data-rest-clock></span>', "show-rest",
        'class="secondary dock-timer" data-control="show-rest" aria-label="查看休息计时"') : "";
      let primary;
      if (showRest) {
        primary = button("结束休息", "end-rest", 'class="primary stretch" data-control="end-rest"');
      } else if (set.done) {
        primary = button(`撤销${label}`, "toggle-set", `class="secondary stretch" data-id="${set.id}" data-control="primary-set"`);
      } else {
        primary = button(`<span class="slide-thumb" aria-hidden="true">→</span>
            <span class="slide-label">滑动完成${label}<small>也可点按</small></span>`,
          "toggle-set", `class="slide-complete stretch" data-id="${set.id}" data-control="primary-set" aria-label="滑动或点按完成${label}"`);
      }
      return `<div class="dock-row">${queue}${timer}${primary}</div>`;
    }

    function sheetPosition() {
      const bounds = device.getBoundingClientRect();
      const screen = window.visualViewport;
      const visibleBottom = (screen?.height ?? innerHeight) + (screen?.offsetTop ?? 0);
      const mobile = matchMedia("(max-width: 730px)").matches;
      const bottom = Math.min(bounds.bottom - (mobile ? 0 : 4), visibleBottom);
      sheet.style.setProperty("--sheet-width", `${bounds.width - (mobile ? 0 : 10)}px`);
      sheet.style.setProperty("--sheet-center", `${bounds.left + bounds.width / 2}px`);
      sheet.style.setProperty("--sheet-bottom", `${innerHeight - bottom}px`);
      sheet.style.setProperty("--sheet-height", `${Math.max(100, bottom - Math.max(0, bounds.top) - 5)}px`);
    }

    function sheetContent(title, contents, closeLabel = "") {
      return `<div class="sheet-inner">
        <div class="sheet-head">
          <h2 id="sheet-title">${title}</h2>
          ${button(closeLabel || "×", "close-sheet",
            `${closeLabel ? 'class="text-close"' : ""} aria-label="${closeLabel || "关闭"}" data-control="close-sheet"`)}
        </div>${contents}
      </div>`;
    }

    function showSheet(kind, details = {}) {
      const returnControl = modal?.returnControl ?? document.activeElement?.dataset.control;
      modal = {kind, returnControl, ...details};
      sheet.dataset.kind = kind;
      sheetPosition();
      renderSheet();
      if (!sheet.open) sheet.showModal();
      sheet.scrollTop = 0;
      sheet.querySelector('[data-control="close-sheet"]')?.focus({preventScroll:true});
    }

    function closeSheet() {
      const returnControl = modal?.returnControl;
      modal = null;
      if (sheet.open) sheet.close();
      if (returnControl) device.querySelector(`[data-control="${returnControl}"]`)?.focus({preventScroll:true});
    }

    function queueSheet() {
      const ordered = modal.order;
      return sheetContent(ordered ? "调整动作顺序" : "训练动作", `
        <div class="sheet-list">
        ${state.exercises.map((exercise, index) => `<div class="sheet-row ${exercise.id === state.activeId ? "selected" : ""}">
          <span class="ordinal" aria-hidden="true">${pad(index + 1)}</span>
          ${button(`${artwork(exercise)}<div><strong>${exercise.name}</strong>
            <span class="minor">${completed(exercise)} / ${exercise.sets.length} 组已记录</span></div>
            ${!ordered ? chevron() : ""}`, "queue-pick", `class="sheet-picker-row" data-id="${exercise.id}"`)}
          ${ordered ? `<div class="queue-order">
            ${[-1, 1].map(delta => button(delta < 0 ? "↑" : "↓", "move-exercise",
              `data-id="${exercise.id}" data-delta="${delta}" data-control="move-${exercise.id}-${delta}"
                aria-label="${delta < 0 ? "上移" : "下移"}${exercise.name}" ${state.exercises[index + delta] ? "" : "disabled"}`
            )).join("")}
          </div>` : ""}
        </div>`).join("")}
        </div>
        <div class="sheet-actions">
          ${button(ordered ? "完成排序" : "调整顺序", ordered ? "close-sheet" : "queue-order", 'class="secondary"')}
          ${button("添加动作", "add-exercise", 'class="primary"')}
        </div>
        ${state.exercises.length && !ordered ? button("当前动作休息设置", "exercise-settings",
            `class="inline-link" data-id="${currentExercise().id}"`) : ""}`);
    }

    function librarySheet() {
      return sheetContent("添加动作", `
        <input type="search" class="sheet-search" id="exercise-search" placeholder="搜索动作、部位或器械" aria-label="搜索动作、部位或器械" autocomplete="off">
        <div class="sheet-list" id="library-results">${libraryResults("")}</div>`);
    }

    function detailsSheet() {
      const exercise = findExercise(modal.exerciseId);
      return sheetContent(exercise.name, `<div class="sheet-art">${artwork(exercise, `${exercise.name}动作示意`)}</div>
        <p class="sheet-copy">${exercise.muscle} / ${exercise.gear}</p>
        <h3 class="sheet-settings-title">组间休息</h3>
        <div class="rest-preset">
          ${[0, 30, 60, 90, 120].map(value => button(value ? `${value} 秒` : "关闭", "rest-preset",
            `data-delta="${value}" data-id="${exercise.id}" data-control="preset-${value}" aria-pressed="${exercise.rest === value}"`
          )).join("")}
        </div>
        <p class="minor" style="margin-top:8px">此设置用于当前动作的后续组。</p>`);
    }

    function keypadSheet() {
      const {exercise, set} = lookup(modal.setId);
      const first = exercise.sets[0] === set && modal.field === "weight";
      return sheetContent(`编辑${fieldLabel(modal.field)}`, `
        <div class="keypad-readout">
          <div><span class="minor">${exercise.name}</span><span class="minor">${setLabel(exercise, set)}</span></div>
          <strong data-keypad-value>${modal.buffer || "—"}</strong>
        </div>
        <div class="keypad-navigation">
          ${button("上一项", "key-field", `class="sub-button" data-delta="-1" data-control="key-prev" ${first ? "disabled" : ""}`)}
          ${button("下一项", "key-field", 'class="sub-button" data-delta="1" data-control="key-next"')}
          ${button("加一组", "key-add", 'class="sub-button" data-control="key-add"')}
        </div>
        <div class="keypad-grid">
          ${["1","2","3","4","5","6","7","8","9",".","0","⌫"].map(key => button(key, "key-type",
            `data-key="${key}" aria-label="${key === "⌫" ? "删除一位" : key === "." ? "小数点" : key}"
              ${key === "." && modal.field === "reps" ? "disabled" : ""}`
          )).join("")}
        </div>`, "收起");
    }

    function openKeypad(id, field) {
      const {exercise, set} = lookup(id);
      const buffer = set[field] === null ? "" : String(set[field]);
      setSelection(exercise, set);
      showSheet("keypad", {setId:id, field, buffer, replace:true});
    }

    function keyType(key) {
      const {field, replace, buffer, setId} = modal;
      if (key === "." && field !== "weight") return;
      const draft = replace && key !== "⌫" ? "" : buffer;
      let value;
      if (key === "⌫") value = draft.slice(0, -1);
      else if (key === ".") value = draft.includes(".") ? draft : `${draft || "0"}.`;
      else value = /^[0-9]$/.test(key) ? `${draft === "0" ? "" : draft}${key}` : draft;
      if (!/^\d{0,4}(\.\d{0,2})?$/.test(value)) return;
      modal.buffer = value;
      modal.replace = false;
      lookup(setId).set[field] = value ? Number(value) : null;
      sheet.querySelector("[data-keypad-value]").textContent = value || "—";
      render();
    }

    function stepField(delta) {
      const {exercise, set} = lookup(modal.setId);
      const fields = exercise.sets.flatMap(item => [
        {id:item.id, field:"weight"}, {id:item.id, field:"reps"}
      ]);
      const at = fields.findIndex(item => item.id === set.id && item.field === modal.field);
      const next = fields[at + delta];
      if (next) {
        const control = document.activeElement?.dataset.control;
        openKeypad(next.id, next.field);
        if (control) sheet.querySelector(`[data-control="${control}"]:not(:disabled)`)?.focus({preventScroll:true});
      } else if (delta > 0) closeSheet();
    }

    function moveExercise(id, delta) {
      const index = state.exercises.findIndex(exercise => exercise.id === id);
      const neighbor = index + delta;
      if (neighbor < 0 || neighbor >= state.exercises.length) return;
      [state.exercises[index], state.exercises[neighbor]] = [state.exercises[neighbor], state.exercises[index]];
      const control = document.activeElement?.dataset.control;
      const offset = sheet.scrollTop;
      render();
      renderSheet();
      sheet.scrollTop = offset;
      sheet.querySelector(`[data-control="${control}"]:not(:disabled), [data-control="move-${id}-${-delta}"]:not(:disabled)`)?.focus({preventScroll:true});
    }

    const themes = {
      lilac: {name:"雾紫", sample:["#f7f3ff","#c5b4f3","#5537ad"]},
      ocean: {name:"海盐蓝", sample:["#f1f7ff","#accee9","#245889"]},
      pine: {name:"松针绿", sample:["#f1f7ee","#b8d8bf","#216c53"]},
      apricot: {name:"暖杏", sample:["#fff5ef","#f6beac","#a1432e"]}
    };
    const initialTheme = new URLSearchParams(location.search).get("theme");
    let theme = Object.hasOwn(themes, initialTheme) ? initialTheme : "lilac";

    function writeThemeUrl() {
      const url = new URL(location.href);
      if (theme === "lilac") url.searchParams.delete("theme");
      else url.searchParams.set("theme", theme);
      if (url.href !== location.href) history.replaceState(history.state, "", url);
    }

    function applyTheme(next, syncUrl = true) {
      if (!Object.hasOwn(themes,next)) return;
      theme = next;
      document.documentElement.dataset.theme = theme;
      if (syncUrl) writeThemeUrl();
      sheet.querySelectorAll(".theme-choice").forEach(option => {
        const current = option.dataset.id === next;
        option.setAttribute("aria-pressed", current);
        option.querySelector(".theme-check").textContent = current ? "✓" : "";
      });
    }

    function themeControl() {
      return button('<span class="palette-icon" aria-hidden="true"><i></i><i></i><i></i></span><span>主题</span>',
        "theme", 'class="theme-control" data-control="theme" aria-label="色调主题"');
    }

    function themeSheet() {
      return sheetContent("色调主题", `<div class="theme-grid">${Object.entries(themes).map(([id, palette]) => button(
        `<span class="theme-swatches" aria-hidden="true">${palette.sample.map(color => `<i style="background:${color}"></i>`).join("")}</span>
          <span class="theme-name"><strong>${palette.name}</strong><span class="theme-check" aria-hidden="true">${id === theme ? "✓" : ""}</span></span>`,
        "select-theme", `class="theme-choice" data-id="${id}" data-control="theme-${id}" aria-pressed="${theme === id}"`
      )).join("")}</div>`);
    }

    function endSheet() {
      const data = stats();
      const remaining = data.total - data.done;
      const copy = !data.done ? "这场训练还没有完成的组。结束后，首页不会新增记录。"
        : remaining ? `还有 <strong>${remaining} 组未完成</strong>，回顾会显示本次已记录的组。`
        : "本次所有组均已完成。可以在回顾中查看用时和训练量。";
      return sheetContent("结束训练？", `<p class="sheet-copy">${copy}</p>
        <div class="finish-counts">
          <div><strong>${data.loggedExercises}</strong><span class="minor">已记录动作</span></div>
          <div><strong>${data.done}</strong><span class="minor">已完成组</span></div>
        </div>
        <div class="sheet-actions">
          ${button("继续训练", "close-sheet", 'class="secondary" data-control="cancel-finish"')}
          ${button("确认结束", "finish-confirmed", 'class="primary" data-control="confirm-finish"')}
        </div>`);
    }

    function resetSheet() {
      return sheetContent("重置示例？", `<p class="sheet-copy">演示训练会恢复为刚打开时的数据。</p>
        <div class="sheet-actions">
          ${button("返回", "close-sheet", 'class="secondary"')}
          ${button("重置示例", "reset", 'class="primary"')}
        </div>`);
    }

    function conflictSheet() {
      return sheetContent("还有一场训练在进行", `<p class="sheet-copy">正在记录「${state.name}」。你可以继续这场训练，或放弃它并开始新的训练。</p>
        <div class="sheet-actions">
          ${linkPage("继续当前", "workout", "", 'class="secondary"')}
          ${button("放弃并开始", "replace-workout", 'class="primary"')}
        </div>`);
    }

    function libraryResults(query) {
      const results = libraryMatches(query);
      if (!results.length) return '<p class="search-empty">没有匹配动作，试试动作名或器械。</p>';
      return results.map(([code, exercise]) => `<div class="sheet-row">
        ${button(`${artwork({code})}<div><strong>${exercise.name}</strong>
          <span class="minor">${exercise.muscle} / ${exercise.gear}</span></div><b aria-hidden="true">＋</b>`,
          "library-pick", `class="sheet-picker-row" data-id="${code}" aria-label="添加${exercise.name}"`)}
      </div>`).join("");
    }

    function renderSheet() {
      const renderers = {
        finish:endSheet, reset:resetSheet, conflict:conflictSheet, theme:themeSheet, queue:queueSheet,
        library:librarySheet, detail:detailsSheet, keypad:keypadSheet
      };
      sheet.innerHTML = renderers[modal.kind]();
    }

    function handleAction(element) {
      const {action, id, page, field, delta, key} = element.dataset;
      switch (action) {
        case "preview": changeRoute(page); break;
        case "go": changeRoute(page, id); break;
        case "back": goBack(); break;
        case "minimize": changeRoute("home"); break;
        case "begin": beginWorkout(id || null); break;
        case "replace-workout": {
          const planId = modal.planId;
          closeSheet();
          startWorkout(planId);
          break;
        }
        case "calendar-day": chosenDay = chosenDay === id ? "" : id; render(); break;
        case "clear-day": chosenDay = ""; render(); break;
        case "plan-filter": planFilter = id; render(); break;
        case "plan-row": {
          const label = `${route.item}-${id}`;
          openPlanRow = openPlanRow === label ? "" : label;
          render();
          if (openPlanRow) keepVisible(`[data-control="plan-step-${id}"]`);
          break;
        }
        case "library-filter": libraryFilter = id; render(); break;
        case "library-clear": libraryQuery = ""; libraryFilter = "全部"; render(); break;
        case "detail-tab": detailTab = id; render(); break;
        case "recap-row": openRecapRow = openRecapRow === id ? "" : id; render(); break;
        case "theme": showSheet("theme"); break;
        case "select-theme": applyTheme(id); break;
        case "ask-reset": showSheet("reset"); break;
        case "reset": resetSession(); break;
        case "finish": showSheet("finish"); break;
        case "finish-confirmed": recapSession(); break;
        case "close-sheet": closeSheet(); break;
        case "queue": showSheet("queue", {order:false}); break;
        case "queue-pick": closeSheet(); changeExercise(findExercise(id)); break;
        case "queue-order": showSheet("queue", {order:true}); break;
        case "move-exercise": moveExercise(id, Number(delta)); break;
        case "add-exercise": showSheet("library"); break;
        case "library-pick": addExercise(id); break;
        case "select-exercise": changeExercise(findExercise(id)); break;
        case "step-set": stepSet(Number(delta)); break;
        case "toggle-set": toggleSet(id); break;
        case "add-set": addSet(findExercise(id)); break;
        case "exercise-settings": showSheet("detail", {exerciseId:id}); break;
        case "edit": openKeypad(id, field); break;
        case "key-type": keyType(key); break;
        case "key-field": stepField(Number(delta)); break;
        case "key-add": addSet(lookup(modal.setId).exercise, true); break;
        case "rest-preset": {
          const exercise = findExercise(id);
          exercise.rest = Number(delta);
          exercise.restOverride = true;
          sheet.querySelectorAll('[data-action="rest-preset"]').forEach(preset =>
            preset.setAttribute("aria-pressed", Number(preset.dataset.delta) === exercise.rest));
          break;
        }
        case "adjust-rest": adjustRest(Number(delta)); break;
        case "end-rest": endRest(); break;
        case "hide-rest": state.restFolded = true; render({animate:true}); break;
        case "show-rest": revealRest(); break;
      }
    }

    document.addEventListener("click", (event) => {
      const element = event.target.closest("[data-action]");
      if (!element || element.disabled) return;
      if (interruptedSlideClick === element) {
        interruptedSlideClick = null;
        if (event.detail) return;
      }
      handleAction(element);
    });
    sheet.addEventListener("click", (event) => {
      if (event.target !== sheet) return;
      const bounds = sheet.getBoundingClientRect();
      if (event.clientX < bounds.left || event.clientX > bounds.right ||
          event.clientY < bounds.top || event.clientY > bounds.bottom) closeSheet();
    });
    sheet.addEventListener("cancel", (event) => {
      event.preventDefault();
      closeSheet();
    });

    document.addEventListener("input", (event) => {
      if (event.target.id === "library-search") {
        libraryQuery = event.target.value;
        adjustLibrary();
      } else if (event.target.id === "exercise-search") {
        sheet.querySelector("#library-results").innerHTML = libraryResults(event.target.value);
        sheet.scrollTop = 0;
      }
    });

    document.addEventListener("keydown", (event) => {
      if (modal?.kind !== "keypad" || event.ctrlKey || event.altKey || event.metaKey) return;
      if (/^[0-9]$/.test(event.key) || event.key === "." || event.key === "Backspace") {
        event.preventDefault();
        keyType(event.key === "Backspace" ? "⌫" : event.key);
      }
    });

    window.addEventListener("resize", () => { if (sheet.open) sheetPosition(); });
    window.visualViewport?.addEventListener("resize", () => { if (sheet.open) sheetPosition(); });
    window.addEventListener("scroll", () => { if (sheet.open) sheetPosition(); }, {passive:true});
    window.addEventListener("popstate", () => {
      if (modal) closeSheet();
      scrollPositions.set(routeKey(route), viewport.scrollTop);
      route = readRoute();
      if (route.page === "workout" && !state) {
        changeRoute("home", "", {replace:true, animate:false});
        return;
      }
      writeThemeUrl();
      render({scrollTop:scrollPositions.get(routeKey(route)) ?? 0, animate:true});
    });

    applyTheme(theme, false);
    render();
    setInterval(() => {
      if (state?.rest && !restRemaining()) endRest();
      else updateClocks();
    }, 200);

  </script>
